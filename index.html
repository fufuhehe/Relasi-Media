<!DOCTYPE html>
<html lang="id" data-tema="terang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker Kegiatan Tim</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#000080">
<link rel="icon" href="./icon-192.png">
<style>
:root{
  --face:#c0c0c0; --light:#ffffff; --soft:#dfdfdf; --shadow:#808080; --dark:#000000;
  --text:#000000; --textdim:#404040; --field:#ffffff; --fieldtext:#000000;
  --title1:#000080; --title2:#1084d0; --titletext:#ffffff;
  --title1x:#808080; --title2x:#b5b5b5;
  --sel:#000080; --seltext:#ffffff;
  --bar1:#000080; --bar2:#808000; --alert:#a00000; --ok:#006000;
}
html[data-tema="gelap"]{
  --face:#000000; --light:#ffffff; --soft:#c0c0c0; --shadow:#808080; --dark:#ffffff;
  --text:#ffffff; --textdim:#c0c0c0; --field:#000000; --fieldtext:#00ff00;
  --title1:#008080; --title2:#00c0c0; --titletext:#ffffff;
  --title1x:#404040; --title2x:#606060;
  --sel:#008080; --seltext:#ffffff;
  --bar1:#00ffff; --bar2:#ffff00; --alert:#ff6060; --ok:#00ff00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--face); color:var(--text);
  font-family:"MS Sans Serif",Tahoma,Verdana,Geneva,sans-serif;
  font-size:14px; line-height:1.35; padding:6px 6px 40px;
}
h1,h2,h3{margin:0;font-size:14px;font-weight:bold}

.out{border:1px solid;border-color:var(--light) var(--dark) var(--dark) var(--light);
     box-shadow:inset -1px -1px 0 var(--shadow), inset 1px 1px 0 var(--soft);background:var(--face)}
.in{border:1px solid;border-color:var(--shadow) var(--light) var(--light) var(--shadow);
    box-shadow:inset -1px -1px 0 var(--soft), inset 1px 1px 0 var(--dark);background:var(--face)}

.win{margin-bottom:8px;padding:3px}
.tb{display:flex;align-items:center;gap:4px;padding:3px 3px 3px 6px;
    background:linear-gradient(90deg,var(--title1),var(--title2));color:var(--titletext);font-weight:bold}
.tb.off{background:linear-gradient(90deg,var(--title1x),var(--title2x))}
.tb .sp{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{width:22px;height:20px;font-size:11px;font-weight:bold;line-height:1;padding:0;flex:none}
.body{padding:8px}

button,.btn{font-family:inherit;font-size:14px;background:var(--face);color:var(--text);
  border:1px solid;border-color:var(--light) var(--dark) var(--dark) var(--light);
  box-shadow:inset -1px -1px 0 var(--shadow), inset 1px 1px 0 var(--soft);
  min-height:34px;padding:4px 12px;cursor:pointer}
button:active,.btn:active{border-color:var(--shadow) var(--light) var(--light) var(--shadow);
  box-shadow:inset -1px -1px 0 var(--soft), inset 1px 1px 0 var(--dark);padding:5px 11px 3px 13px}
button.kecil{min-height:28px;padding:2px 8px;font-size:13px}
button[disabled]{color:var(--shadow);text-shadow:1px 1px 0 var(--light)}
button.tekan{border-color:var(--shadow) var(--light) var(--light) var(--shadow);
  box-shadow:inset -1px -1px 0 var(--soft), inset 1px 1px 0 var(--dark);font-weight:bold}

input,select,textarea{font-family:inherit;font-size:14px;background:var(--field);color:var(--fieldtext);
  border:1px solid;border-color:var(--shadow) var(--light) var(--light) var(--shadow);
  box-shadow:inset -1px -1px 0 var(--soft), inset 1px 1px 0 var(--dark);
  padding:6px;min-height:32px;width:100%}
textarea{min-height:60px;resize:vertical}
label{display:block;margin:8px 0 3px;font-weight:bold}
.baris{display:flex;gap:6px;flex-wrap:wrap}
.baris>*{flex:1 1 140px}
.aksi{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.aksi>button{flex:1 1 auto}

.tabs{display:flex;gap:2px;margin-bottom:-1px;position:relative;z-index:2;flex-wrap:wrap}
.tab{background:var(--face);border:1px solid;border-color:var(--light) var(--dark) var(--dark) var(--light);
  border-bottom:none;padding:7px 10px;min-height:0;font-size:13px;box-shadow:inset 1px 1px 0 var(--soft)}
.tab.on{font-weight:bold;padding-bottom:9px;margin-top:-2px}

.grp{border:1px solid;border-color:var(--shadow) var(--light) var(--light) var(--shadow);
  padding:8px;margin:10px 0 0;position:relative}
.grp>legend{padding:0 4px;font-weight:bold;font-size:13px}

.kart{padding:8px;margin-bottom:6px;cursor:pointer}
.kart .jud{font-weight:bold;margin-bottom:2px}
.meta{font-size:12px;color:var(--textdim)}
.chip{display:inline-block;padding:1px 5px;margin:2px 3px 0 0;font-size:11px;
  border:1px solid var(--dark);background:var(--face)}
.chip.k{background:var(--sel);color:var(--seltext);border-color:var(--dark)}
.chip.w{border-color:var(--alert);color:var(--alert);font-weight:bold}

table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:4px 5px;text-align:left;border-bottom:1px solid var(--shadow);vertical-align:middle}
th{background:var(--face);font-size:12px;border-bottom:2px solid var(--shadow)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:9px;background:var(--field);border:1px solid var(--shadow);position:relative;min-width:50px}
.bar i{display:block;height:100%}
.bar i.a{background:var(--bar1)} .bar i.b{background:var(--bar2)}

.warn{padding:8px;margin-bottom:8px;border:1px solid var(--alert);background:var(--face);font-size:13px}
.warn b{color:var(--alert)}
.pilih{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--shadow)}
.pilih input[type=checkbox]{width:22px;height:22px;min-height:22px;flex:none;box-shadow:none}
.pilih .nm{flex:1;min-width:0}
.pilih select{width:auto;min-width:88px;flex:none;font-size:12px;min-height:28px;padding:3px}
.kosong{padding:16px;text-align:center;color:var(--textdim);font-size:13px}
.bawah{position:fixed;left:0;right:0;bottom:0;background:var(--face);
  border-top:1px solid var(--light);padding:3px 6px;display:flex;gap:6px;align-items:center;font-size:12px;
  box-shadow:0 -1px 0 var(--shadow)}
.bawah .st{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border:1px solid;border-color:var(--shadow) var(--light) var(--light) var(--shadow);padding:2px 5px}
.tutup{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;overflow:auto;padding:8px}
.modal{max-width:620px;margin:12px auto}
</style>
</head>
<body>

<div class="out win">
  <div class="tb"><span class="sp" id="judul">Tracker Kegiatan Tim</span>
    <button class="out tbtn" data-aksi="tema" title="Ganti tema">◐</button>
  </div>
  <div class="body" style="padding:6px 8px" id="ringkas">Memuat…</div>
</div>

<div class="tabs" id="tabs"></div>
<div class="out win" style="padding:8px"><div id="isi" class="kosong">Memuat data…</div></div>

<div class="bawah"><span class="st" id="status">Siap</span>
  <button class="kecil" data-aksi="muat">Refresh</button></div>

<div id="lapis"></div>

<script>
"use strict";
var SB_URL="https://wwgqgsjyaodxfuhjwksj.supabase.co";
var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3Z3Fnc2p5YW9keGZ1aGp3a3NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNzU3ODcsImV4cCI6MjEwMTg1MTc4N30.PfrrLh0TWXT1mvI_ObpDE9iuKn-KhzDiSoCVr3qI5Vo";
var HDR={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"};

var DB={anggota:[],kegiatan:[],penugasan:[],ketersediaan:[],config:{}};
var TAB="kegiatan";
var PIN=null;
var FORM=null;
var MODAL=null;
var PERIODE={tahun:new Date().getFullYear(),bulan:0,kat:"tim"};
var FILTER={status:"aktif",cari:""};

var TIER={dalam_kota:"Dalam kota",luar_pp:"Luar kota (PP)",luar_inap:"Luar kota (nginep)"};
var BEBAN={1:"Ringan",2:"Sedang",3:"Berat"};
var STATUS={rencana:"Rencana",jalan:"Berjalan",selesai:"Selesai",batal:"Batal"};
var BULAN=["Semua bulan","Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var BLN3=["","Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

/* ---------- util ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function stat(m){var e=$("#status"); if(e) e.textContent=m;}
function num(v,d){var n=parseFloat(v); return isFinite(n)?n:d;}
function cfg(k,d){return num(DB.config[k],d);}
function bulat(n){return Math.round(n*10)/10;}
function hariAntara(a,b){
  return Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/86400000);}
function jmlHari(k){return hariAntara(k.tgl_mulai,k.tgl_selesai)+1;}
function iso(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function hariIni(){return iso(new Date());}
function tglPendek(s){var p=s.split("-");return parseInt(p[2],10)+" "+BLN3[parseInt(p[1],10)];}
function rentang(k){
  var a=k.tgl_mulai,b=k.tgl_selesai;
  if(a===b) return tglPendek(a)+" "+a.slice(0,4);
  if(a.slice(0,7)===b.slice(0,7)) return a.split("-")[2].replace(/^0/,"")+"\u2013"+tglPendek(b)+" "+b.slice(0,4);
  return tglPendek(a)+" \u2013 "+tglPendek(b)+" "+b.slice(0,4);}
function tumpang(a1,a2,b1,b2){return !(a2<b1||a1>b2);}

/* ---------- skor ---------- */
function skorJalan(k){
  var hari=jmlHari(k);
  if(k.tier==="luar_inap") return cfg("poin_luar_inap",3)+cfg("poin_per_malam",2)*(hari-1);
  if(k.tier==="luar_pp")   return cfg("poin_luar_pp",2.5)*hari;
  return cfg("poin_dalam_kota",1)*hari;
}
function skorBeban(k,peran){
  return jmlHari(k)*num(k.tingkat_beban,2)*(peran==="ketua"?cfg("faktor_ketua",1.2):1);
}
function batasPeriode(){
  if(!PERIODE.tahun) return {dari:null,sampai:null};
  var t=PERIODE.tahun;
  if(!PERIODE.bulan) return {dari:t+"-01-01",sampai:t+"-12-31"};
  var m=String(PERIODE.bulan).padStart(2,"0");
  var akhir=new Date(Date.UTC(t,PERIODE.bulan,0)).getUTCDate();
  return {dari:t+"-"+m+"-01",sampai:t+"-"+m+"-"+String(akhir).padStart(2,"0")};
}
function petaKegiatan(){
  var m={}; DB.kegiatan.forEach(function(k){m[k.id]=k;}); return m;
}
function rekap(dari,sampai){
  var m={}, kg=petaKegiatan();
  DB.anggota.forEach(function(a){
    m[a.id]={id:a.id,nama:a.nama,kategori:a.kategori,aktif:a.aktif,
             jalan:0,beban:0,hari:0,n:0,daftar:[]};});
  DB.penugasan.forEach(function(p){
    var k=kg[p.kegiatan_id]; if(!k||k.status==="batal") return;
    if(dari&&k.tgl_selesai<dari) return;
    if(sampai&&k.tgl_mulai>sampai) return;
    var o=m[p.anggota_id]; if(!o) return;
    o.jalan+=skorJalan(k); o.beban+=skorBeban(k,p.peran);
    o.hari+=jmlHari(k); o.n++; o.daftar.push({k:k,peran:p.peran});
  });
  return Object.keys(m).map(function(k){return m[k];});
}
function cariBentrok(){
  var kg=petaKegiatan(), per={}, out=[];
  DB.penugasan.forEach(function(p){
    var k=kg[p.kegiatan_id]; if(!k||k.status==="batal") return;
    (per[p.anggota_id]=per[p.anggota_id]||[]).push(k);});
  Object.keys(per).forEach(function(id){
    var arr=per[id].slice().sort(function(a,b){return a.tgl_mulai<b.tgl_mulai?-1:1;});
    for(var i=0;i<arr.length-1;i++){
      for(var j=i+1;j<arr.length;j++){
        if(arr[j].tgl_mulai>arr[i].tgl_selesai) break;
        out.push({anggota_id:parseInt(id,10),a:arr[i],b:arr[j]});
      }
    }
  });
  return out;
}
function cutiPada(angId,m,s){
  return DB.ketersediaan.filter(function(t){
    return t.anggota_id===angId && tumpang(t.tgl_mulai,t.tgl_selesai,m,s);});
}
function bentrokPada(angId,m,s,kecualiKeg){
  var kg=petaKegiatan(), out=[];
  DB.penugasan.forEach(function(p){
    if(p.anggota_id!==angId) return;
    var k=kg[p.kegiatan_id];
    if(!k||k.status==="batal"||k.id===kecualiKeg) return;
    if(tumpang(k.tgl_mulai,k.tgl_selesai,m,s)) out.push(k);});
  return out;
}
function angg(id){
  for(var i=0;i<DB.anggota.length;i++) if(DB.anggota[i].id===id) return DB.anggota[i];
  return null;
}
function timDari(kegId){
  return DB.penugasan.filter(function(p){return p.kegiatan_id===kegId;})
    .map(function(p){var a=angg(p.anggota_id); return a?{a:a,peran:p.peran}:null;})
    .filter(Boolean)
    .sort(function(x,y){
      var r={ketua:0,anggota:1,tu:2};
      return (r[x.peran]-r[y.peran])||x.a.nama.localeCompare(y.a.nama);});
}

/* ---------- jaringan ---------- */
function ambil(path){
  return fetch(SB_URL+"/rest/v1/"+path,{headers:HDR}).then(function(r){
    if(!r.ok) throw new Error("Gagal baca "+path+" ("+r.status+")");
    return r.json();});
}
function rpc(nama,args){
  return fetch(SB_URL+"/rest/v1/rpc/"+nama,{method:"POST",headers:HDR,body:JSON.stringify(args)})
    .then(function(r){
      return r.text().then(function(t){
        if(!r.ok){
          var m=t; try{m=JSON.parse(t).message||t;}catch(e){}
          throw new Error(m);
        }
        try{return JSON.parse(t);}catch(e){return t;}
      });});
}
function muat(){
  stat("Memuat\u2026");
  return Promise.all([
    ambil("keg_anggota?select=*&order=kategori,urutan,nama"),
    ambil("keg_kegiatan?select=*&order=tgl_mulai.desc"),
    ambil("keg_penugasan?select=*"),
    ambil("keg_ketersediaan?select=*&order=tgl_mulai"),
    ambil("keg_config_public?select=*")
  ]).then(function(r){
    DB.anggota=r[0]; DB.kegiatan=r[1]; DB.penugasan=r[2]; DB.ketersediaan=r[3];
    DB.config={}; r[4].forEach(function(c){DB.config[c.kunci]=c.nilai;});
    stat("Data siap \u00b7 "+DB.kegiatan.length+" kegiatan");
    render();
  }).catch(function(e){
    stat("Error: "+e.message);
    $("#isi").innerHTML='<div class="kosong">Gagal memuat data.<br>'+esc(e.message)+"</div>";
  });
}

/* ---------- render kerangka ---------- */
function render(){
  var nm=DB.config.nama_tim||"Tracker Kegiatan Tim";
  $("#judul").textContent=nm;
  document.title=nm;
  var b=cariBentrok();
  $("#ringkas").innerHTML=ringkasan(b);
  var daftar=[["kegiatan","Kegiatan"],["skor","Pemerataan"],["orang","Orang"],["admin",PIN?"Admin \u2713":"Admin"]];
  $("#tabs").innerHTML=daftar.map(function(t){
    return '<button class="tab'+(TAB===t[0]?" on":"")+'" data-aksi="tab" data-v="'+t[0]+'">'+t[1]+"</button>";}).join("");
  var isi=$("#isi"); isi.className="";
  if(TAB==="kegiatan") isi.innerHTML=viewKegiatan();
  else if(TAB==="skor") isi.innerHTML=viewSkor();
  else if(TAB==="orang") isi.innerHTML=viewOrang();
  else isi.innerHTML=viewAdmin();
  gambarLapis();
}
function ringkasan(bentrok){
  var t=hariIni(), aktif=0, dekat=0;
  DB.kegiatan.forEach(function(k){
    if(k.status==="batal") return;
    if(k.tgl_mulai<=t&&k.tgl_selesai>=t) aktif++;
    else if(k.tgl_mulai>t&&hariAntara(t,k.tgl_mulai)<=14) dekat++;});
  var s='<b>'+aktif+"</b> berjalan hari ini \u00b7 <b>"+dekat+"</b> dalam 14 hari";
  if(bentrok.length) s+=' \u00b7 <span style="color:var(--alert)"><b>'+bentrok.length+"</b> bentrok</span>";
  return s;
}

/* ---------- tab: kegiatan ---------- */
function viewKegiatan(){
  var h="";
  var bentrok=cariBentrok();
  if(bentrok.length){
    h+='<div class="warn"><b>Jadwal bentrok:</b><br>'+bentrok.slice(0,6).map(function(x){
      var a=angg(x.anggota_id);
      return esc(a?a.nama:"?")+" \u2014 "+esc(x.a.nama)+" vs "+esc(x.b.nama);}).join("<br>")+
      (bentrok.length>6?"<br>\u2026dan "+(bentrok.length-6)+" lagi":"")+"</div>";
  }
  h+='<div class="baris" style="margin-bottom:8px">'+
     '<select data-aksi="fstatus">'+
       ["aktif|Rencana + berjalan","semua|Semua status","selesai|Selesai","batal|Batal"].map(function(o){
         var p=o.split("|");
         return '<option value="'+p[0]+'"'+(FILTER.status===p[0]?" selected":"")+">"+p[1]+"</option>";}).join("")+
     "</select>"+
     '<input data-aksi="fcari" placeholder="Cari nama / lokasi" value="'+esc(FILTER.cari)+'">'+
     "</div>";
  if(PIN) h+='<div class="aksi" style="margin:0 0 8px"><button data-aksi="baru">+ Kegiatan baru</button>'+
             '<button data-aksi="wa-jadwal">Salin jadwal ke WA</button></div>';

  var list=DB.kegiatan.filter(function(k){
    if(FILTER.status==="aktif"&&!(k.status==="rencana"||k.status==="jalan")) return false;
    if(FILTER.status==="selesai"&&k.status!=="selesai") return false;
    if(FILTER.status==="batal"&&k.status!=="batal") return false;
    if(FILTER.cari){
      var q=FILTER.cari.toLowerCase();
      if((k.nama+" "+k.lokasi+" "+k.jenis).toLowerCase().indexOf(q)<0) return false;}
    return true;});

  if(!list.length) return h+'<div class="kosong">Belum ada kegiatan yang cocok.</div>';
  h+=list.map(function(k){
    var tim=timDari(k.id);
    return '<div class="in kart" data-aksi="detail" data-v="'+k.id+'">'+
      '<div class="jud">'+esc(k.nama)+"</div>"+
      '<div class="meta">'+rentang(k)+" \u00b7 "+jmlHari(k)+" hari \u00b7 "+esc(k.lokasi||"\u2013")+"</div>"+
      '<div style="margin-top:3px">'+
        '<span class="chip">'+TIER[k.tier]+"</span>"+
        '<span class="chip">Beban '+BEBAN[k.tingkat_beban]+"</span>"+
        '<span class="chip'+(k.status==="rencana"||k.status==="jalan"?" k":"")+'">'+STATUS[k.status]+"</span>"+
        '<span class="chip">Jalan '+bulat(skorJalan(k))+"</span>"+
      "</div>"+
      '<div style="margin-top:3px">'+(tim.length?tim.map(function(t){
        return '<span class="chip">'+esc(t.a.nama)+(t.peran==="ketua"?" \u2605":t.peran==="tu"?" (TU)":"")+"</span>";}).join("")
        :'<span class="chip w">Belum ada personel</span>')+"</div>"+
      "</div>";}).join("");
  return h;
}

/* ---------- tab: pemerataan ---------- */
function viewSkor(){
  var b=batasPeriode(), r=rekap(b.dari,b.sampai);
  var kat=PERIODE.kat;
  var rows=r.filter(function(x){return x.kategori===kat&&(x.aktif||x.n>0);});
  rows.sort(function(x,y){return x.jalan-y.jalan;});
  var maxJ=1,maxB=1;
  rows.forEach(function(x){maxJ=Math.max(maxJ,x.jalan);maxB=Math.max(maxB,x.beban);});
  var pakai=rows.filter(function(x){return x.n>0;});
  var avgJ=pakai.length?pakai.reduce(function(s,x){return s+x.jalan;},0)/pakai.length:0;
  var avgB=pakai.length?pakai.reduce(function(s,x){return s+x.beban;},0)/pakai.length:0;

  var thn=[], y=new Date().getFullYear();
  for(var i=y+1;i>=y-3;i--) thn.push(i);
  var h='<div class="baris" style="margin-bottom:8px">'+
    '<select data-aksi="ptahun"><option value="0"'+(PERIODE.tahun?"":" selected")+">Semua waktu</option>"+
      thn.map(function(t){return '<option value="'+t+'"'+(PERIODE.tahun===t?" selected":"")+">"+t+"</option>";}).join("")+"</select>"+
    '<select data-aksi="pbulan"'+(PERIODE.tahun?"":" disabled")+">"+
      BULAN.map(function(n,i){return '<option value="'+i+'"'+(PERIODE.bulan===i?" selected":"")+">"+n+"</option>";}).join("")+"</select>"+
    "</div>"+

/* ---------- teks WA & CSV ---------- */
function salin(t,pesan){
  var ok=function(){stat(pesan||"Tersalin ke clipboard");};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(ok,function(){salinLama(t,ok);});
  } else salinLama(t,ok);
}
function salinLama(t,ok){
  var ta=document.createElement("textarea");
  ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{document.execCommand("copy");ok();}catch(e){stat("Gagal menyalin");}
  document.body.removeChild(ta);
}
function teksKegiatan(k){
  var tim=timDari(k.id);
  var s="*"+k.nama+"*\n";
  s+="\ud83d\udcc5 "+rentang(k)+" ("+jmlHari(k)+" hari)\n";
  s+="\ud83d\udccd "+(k.lokasi||"-")+" \u2014 "+TIER[k.tier].toLowerCase()+"\n";
  var inti=tim.filter(function(t){return t.peran!=="tu";});
  var tu=tim.filter(function(t){return t.peran==="tu";});
  if(inti.length) s+="\nTim: "+inti.map(function(t){
    return t.a.nama+(t.peran==="ketua"?" (ketua)":"");}).join(", ")+"\n";
  if(tu.length) s+="TU: "+tu.map(function(t){return t.a.nama;}).join(", ")+"\n";
  if(k.catatan) s+="\n"+k.catatan+"\n";
  return s;
}
function teksJadwal(){
  var t=hariIni();
  var l=DB.kegiatan.filter(function(k){
    return k.status!=="batal"&&k.tgl_selesai>=t;})
    .sort(function(a,b){return a.tgl_mulai<b.tgl_mulai?-1:1;}).slice(0,10);
  if(!l.length) return "Tidak ada kegiatan mendatang.";
  return "*Jadwal kegiatan mendatang*\n\n"+l.map(teksKegiatan).join("\n");
}
function teksRekap(){
  var b=batasPeriode(), r=rekap(b.dari,b.sampai);
  var judul="*Rekap kegiatan \u2014 "+(PERIODE.tahun?(PERIODE.bulan?BULAN[PERIODE.bulan]+" ":"")+PERIODE.tahun:"semua waktu")+"*\n";
  var s=judul;
  ["tim","tu"].forEach(function(kat){
    var rows=r.filter(function(x){return x.kategori===kat&&(x.aktif||x.n>0);});
    if(!rows.length) return;
    rows.sort(function(x,y){return y.jalan-x.jalan;});
    s+="\n_"+(kat==="tim"?"Tim inti":"Anak TU")+"_\n";
    rows.forEach(function(x,i){
      s+=(i+1)+". "+x.nama+" \u2014 jalan "+bulat(x.jalan)+", beban "+bulat(x.beban)+
         " ("+x.n+" keg / "+x.hari+" hari)\n";});
  });
  return s;
}
function unduhCSV(){
  var kg=petaKegiatan(), baris=[["kegiatan","mulai","selesai","hari","lokasi","tier","beban","status","nama","peran","skor_jalan","skor_beban"]];
  DB.penugasan.forEach(function(p){
    var k=kg[p.kegiatan_id], a=angg(p.anggota_id);
    if(!k||!a) return;
    baris.push([k.nama,k.tgl_mulai,k.tgl_selesai,jmlHari(k),k.lokasi,TIER[k.tier],
      BEBAN[k.tingkat_beban],STATUS[k.status],a.nama,p.peran,
      bulat(skorJalan(k)),bulat(skorBeban(k,p.peran))]);});
  var csv=baris.map(function(r){return r.map(function(c){
    return '"'+String(c==null?"":c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  var url=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));
  var a=document.createElement("a");
  a.href=url; a.download="kegiatan-"+hariIni()+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  stat("CSV diunduh");
}

  var t=ev.target.closest("[data-aksi]"); if(!t) return;
  var a=t.getAttribute("data-aksi"), v=t.getAttribute("data-v");
  if(a==="tema"){
    var g=document.documentElement.getAttribute("data-tema")==="gelap";
    document.documentElement.setAttribute("data-tema",g?"terang":"gelap");
    try{localStorage.setItem("keg_tema",g?"terang":"gelap");}catch(e){}
    return;
  }
  if(a==="muat"){muat();return;}
  if(a==="tab"){TAB=v;render();return;}
  if(a==="tutup"){tutupModal();return;}
  if(a==="batal"){FORM=null;gambarLapis();return;}
  if(a==="detail"){detailKegiatan(parseInt(v,10));return;}
  if(a==="lihat-orang"){detailOrang(parseInt(v,10));return;}
  if(a==="baru"){bukaForm(null);return;}
  if(a==="edit-keg"){
    var k=null; DB.kegiatan.forEach(function(x){if(x.id===parseInt(v,10)) k=x;});
    if(k) bukaForm(k); return;}
  if(a==="simpan-keg"){simpanKegiatan();return;}
  if(a==="hapus-keg"){
    if(!confirm("Hapus kegiatan ini beserta penugasannya?")) return;
    rpc("keg_hapus_kegiatan",{p_pin:PIN,p_id:parseInt(v,10)})
      .then(function(){FORM=null;return muat();})
      .then(function(){stat("Kegiatan dihapus");})
      .catch(function(e){stat("Gagal: "+e.message);});
    return;}
  if(a==="pkat"){PERIODE.kat=v;render();return;}
  if(a==="wa-keg"){
    var kk=null; DB.kegiatan.forEach(function(x){if(x.id===parseInt(v,10)) kk=x;});
    if(kk) salin(teksKegiatan(kk),"Detail kegiatan tersalin");return;}
  if(a==="wa-jadwal"){salin(teksJadwal(),"Jadwal tersalin");return;}
  if(a==="wa-rekap"){salin(teksRekap(),"Rekap tersalin");return;}
  if(a==="csv"){unduhCSV();return;}
  if(a==="login"){
    var p=$("#inpPin").value.trim();
    if(!p){stat("Isi PIN dulu");return;}
    stat("Memeriksa\u2026");
    rpc("keg_cek_pin",{p_pin:p}).then(function(ok){
      if(ok===true){PIN=p;try{localStorage.setItem("keg_pin",p);}catch(e){}
        stat("Mode admin aktif");render();}
      else stat("PIN salah");
    }).catch(function(e){stat("Gagal: "+e.message);});
    return;}
  if(a==="logout"){PIN=null;try{localStorage.removeItem("keg_pin");}catch(e){}
    stat("Keluar mode admin");render();return;}
  if(a==="anggota-baru"){formAnggota(null);return;}
  if(a==="anggota-edit"){formAnggota(angg(parseInt(v,10)));return;}
  if(a==="anggota-simpan"){
    var nm=$("#aNama").value.trim();
    if(!nm){stat("Nama wajib diisi");return;}
    rpc("keg_simpan_anggota",{p_pin:PIN,p_id:v?parseInt(v,10):null,p_nama:nm,
      p_kategori:$("#aKat").value,p_aktif:$("#aAktif").value==="1"})
      .then(function(){tutupModal();return muat();})
      .then(function(){stat("Anggota tersimpan");})
      .catch(function(e){stat("Gagal: "+e.message);});
    return;}
  if(a==="anggota-hapus"){
    if(!confirm("Hapus orang ini? Semua penugasannya ikut terhapus.")) return;
    rpc("keg_hapus_anggota",{p_pin:PIN,p_id:parseInt(v,10)})
      .then(function(){tutupModal();return muat();})
      .then(function(){stat("Anggota dihapus");})
      .catch(function(e){stat("Gagal: "+e.message);});
    return;}
  if(a==="cuti-baru"){formCuti();return;}
  if(a==="cuti-simpan"){
    var m=$("#cMulai").value,s=$("#cSelesai").value;
    if(s<m) s=m;
    rpc("keg_simpan_ketersediaan",{p_pin:PIN,p_id:null,
      p_anggota_id:parseInt($("#cAng").value,10),p_tgl_mulai:m,p_tgl_selesai:s,
      p_alasan:$("#cAlasan").value})
      .then(function(){tutupModal();return muat();})
      .then(function(){stat("Tersimpan");})
      .catch(function(e){stat("Gagal: "+e.message);});
    return;}
  if(a==="cuti-hapus"){
    rpc("keg_hapus_ketersediaan",{p_pin:PIN,p_id:parseInt(v,10)})
      .then(function(){return muat();})
      .then(function(){stat("Dihapus");})
      .catch(function(e){stat("Gagal: "+e.message);});
    return;}
  if(a==="simpan-cfg"){
    var inp=document.querySelectorAll("[data-cfg]"), tugas=[];
    inp.forEach(function(i){
      var k=i.getAttribute("data-cfg"), val=i.value.trim();
      if(k==="pin"){ if(val) tugas.push(["pin",val]); return; }
      if(val!==""&&val!==DB.config[k]) tugas.push([k,val]);});
    if(!tugas.length){stat("Tidak ada perubahan");return;}
    var pinBaru=null;
    tugas.forEach(function(x){if(x[0]==="pin") pinBaru=x[1];});
    stat("Menyimpan\u2026");
    tugas.reduce(function(pr,x){
      return pr.then(function(){return rpc("keg_set_config",{p_pin:PIN,p_kunci:x[0],p_nilai:x[1]});});
    },Promise.resolve()).then(function(){
      if(pinBaru){PIN=pinBaru;try{localStorage.setItem("keg_pin",pinBaru);}catch(e){}}
      return muat();
    }).then(function(){stat("Pengaturan tersimpan");})
      .catch(function(e){stat("Gagal: "+e.message);});
    return;}
});

document.addEventListener("change",function(ev){
  var el=ev.target;
  if(el.hasAttribute&&el.hasAttribute("data-f")){
    bacaForm(); gambarLapis(); return;}
  if(el.hasAttribute&&el.hasAttribute("data-tim")){
    bacaForm(); gambarLapis(); return;}
  var a=el.getAttribute?el.getAttribute("data-aksi"):null;
  if(a==="fstatus"){FILTER.status=el.value;render();return;}
  if(a==="ptahun"){PERIODE.tahun=parseInt(el.value,10)||0;render();return;}
  if(a==="pbulan"){PERIODE.bulan=parseInt(el.value,10)||0;render();return;}
});
document.addEventListener("input",function(ev){
  var a=ev.target.getAttribute?ev.target.getAttribute("data-aksi"):null;
  if(a==="fcari"){
    FILTER.cari=ev.target.value;
    var pos=ev.target.selectionStart;
    render();
    var n=document.querySelector('[data-aksi="fcari"]');
    if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}
  }
});

/* ---------- start ---------- */
(function(){
  try{
    var tm=localStorage.getItem("keg_tema");
    if(!tm&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches) tm="gelap";
    if(tm) document.documentElement.setAttribute("data-tema",tm);
    var sp=localStorage.getItem("keg_pin");
    if(sp) PIN=sp;
  }catch(e){}
  muat();
  if("serviceWorker" in navigator)
    navigator.serviceWorker.register("./sw.js").catch(function(){});
})();
</script>
