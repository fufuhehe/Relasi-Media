<script>
"use strict";
var SB_URL="https://wwgqgsjyaodxfuhjwksj.supabase.co";

var HDR={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"};

var DB={anggota:[],jenis:[],kegiatan:[],penugasan:[],foto:[],sbm:[],kota:[],config:{}};
var FOTO_URL={};
var BULAN_BUKA=null;
var ADMIN_BUKA={};
var MODAL_KEG=null;
var SANDI="", BARU=false, GERBANG=false;
var LB=null;
var TAB="catat", PIN=null, FORM=null, MODAL=null;
var PERIODE={tahun:new Date().getFullYear(),jenis:0};
var CATAT_JENIS=0;
var URUT="jalan";   // urutan tab Orang: "jalan" | "beban" | "kali"

var TIER={dalam_kota:"Dalam kota",luar_pp:"Luar kota PP",luar_inap:"Luar kota nginep"};
var TIERP={dalam_kota:"Dlm kota",luar_pp:"Luar PP",luar_inap:"Luar nginep"};
var BEBAN={1:"Ringan",2:"Sedang",3:"Berat"};
var BLN3=["","Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
var BLN=["","Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

/* ---------- util ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function stat(m){var e=$("#status"); if(e) e.textContent=m;}
function num(v,d){var n=parseFloat(v); return isFinite(n)?n:d;}
function cfg(k,d){return num(DB.config[k],d);}
function bulat(n){return Math.round(n*10)/10;}
function rupiah(n){
  n=Math.round(num(n,0));
  if(n<=0) return "Rp 0";
  if(n>=1000000){
    var j=n/1000000;
    var teks=(j>=10)?String(Math.round(j)):String(Math.round(j*10)/10).replace(".",",");
    return "Rp "+teks+"jt";}
  return "Rp "+Math.round(n/1000)+"rb";}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+
  "-"+String(d.getDate()).padStart(2,"0");}
function hariIni(){return iso(new Date());}
function geser(s,n){var t=Date.parse(s+"T00:00:00Z")+n*86400000;return new Date(t).toISOString().slice(0,10);}
function akhir(k){return k.tanggal?geser(k.tanggal,Math.max(0,num(k.jumlah_hari,1)-1)):null;}
function tglTeks(k,tanpaThn){
  /* tanpaThn dipakai di kartu daftar: tahunnya sudah tertulis di judul
     bulan tepat di atasnya, jadi mengulangnya cuma mendorong lokasi
     turun ke baris kedua. */
  if(!k.tanggal) return "tanggal belum ada";
  var p=k.tanggal.split("-"), a=parseInt(p[2],10)+" "+BLN3[parseInt(p[1],10)];
  var th=tanpaThn?"":" "+p[0];
  var h=num(k.jumlah_hari,1);
  if(h<=1) return a+th;
  var b=akhir(k).split("-");
  if(b[1]===p[1]) return parseInt(p[2],10)+"\u2013"+parseInt(b[2],10)+" "+BLN3[parseInt(p[1],10)]+th;
  return a+" \u2013 "+parseInt(b[2],10)+" "+BLN3[parseInt(b[1],10)]+(tanpaThn?"":" "+b[0]);}
function tumpang(a1,a2,b1,b2){return !(a2<b1||a1>b2);}
function labelFilter(){var j=PERIODE.jenis?cari(DB.jenis,PERIODE.jenis):null;
  return (PERIODE.tahun||"semua waktu")+(j?" \u00b7 "+j.nama:"");}
function cari(arr,id){for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i];return null;}
function fotoDi(kegId){return DB.foto.filter(function(f){return f.kegiatan_id===kegId;});}
function namaRingkas(k,maks){
  var o=orangDi(k.id);
  if(!o.length) return '<span class="lbh">belum ada nama</span>';
  var ket=[],sisa=[];
  o.forEach(function(a){ (k.ketua_id===a.id?ket:sisa).push(a); });
  var urut=ket.concat(sisa), n=maks||4;
  var tampil=urut.slice(0,n).map(function(a){
    return esc(a.nama)+(k.ketua_id===a.id?" *":"");});
  var lebih=urut.length-tampil.length;
  return tampil.join(", ")+(lebih>0?' <span class="lbh">+'+lebih+" lagi</span>":"");}
function angg(id){return cari(DB.anggota,id);}
function namaKeg(k){
  var j=k.jenis_id?cari(DB.jenis,k.jenis_id):null;
  var n=j?j.nama:"(kegiatan dihapus)";
  return k.judul?n+" \u2014 "+k.judul:n;}

/* ---------- skor ---------- */
function kotaKeg(k){
  /* Tujuan khusus (Bodetabek dll) DIPILIH di form, bukan ditebak dari teks
     lokasi. Versi lama menebak, dan "Aston Bintaro" tidak pernah kebaca
     sebagai Tangerang Selatan -- hasilnya Rp 1,47jt padahal SPJ Rp 516rb. */
  if(!k||!k.kota) return null;
  for(var i=0;i<DB.kota.length;i++) if(DB.kota[i].kota===k.kota) return DB.kota[i];
  return null;}
function provKeg(k){
  var t=kotaKeg(k);
  if(t&&t.provinsi) return t.provinsi;
  return (k&&k.provinsi)||DB.config.provinsi_basis||"DKI Jakarta";}
function tarif(nama){
  for(var i=0;i<DB.sbm.length;i++) if(DB.sbm[i].provinsi===nama) return DB.sbm[i];
  return null;}
function transportLuar(t){
  if(!t) return 0;
  if(num(t.transport_luar,0)>0) return num(t.transport_luar,0);   // diisi manual, menang
  var asal=tarif(DB.config.provinsi_basis||"DKI Jakarta");
  var a=num(asal&&asal.taksi,0), b=num(t.taksi,0);
  if(!b) return 0;
  return (a+b)*Math.max(1,cfg("faktor_transport",1));}
function rinciJalan(k){
  var kt=kotaKeg(k);
  var t=tarif(provKeg(k));
  var hari=Math.max(1,num(k.jumlah_hari,1));
  var hm=Math.min(Math.max(0,num(k.hari_meeting,0)),hari), hn=hari-hm;
  /* Tujuan di provinsi sendiri = DALAM KOTA, berapa pun tier-nya. Rumus
     jalur 3 menganggap berangkat dari luar provinsi; dipakai untuk
     DKI->DKI hasilnya (250+250)x2 = Rp 1jt, padahal kenyataannya 170rb.
     Kalau tujuan khususnya dipilih (mis. Kepulauan Seribu) jalur 1 tetap
     menang, jadi pengecualian ini tidak menabrak kasus itu. */
  var samaProv=!kt && provKeg(k)===(DB.config.provinsi_basis||"DKI Jakarta");
  var luar=(k.tier!=="dalam_kota") && !samaProv;
  if(!t) return {uh:0,transport:0,total:0,hn:hn,hm:hm,
                 lengkap:false,tarifAda:false,kota:!!kt,asal:""};
  /* Hari yang ditanggung panitia TIDAK dapat uang harian sama sekali.
     3 hari dengan meeting di hari kedua -> uang harian 2 hari.
     3 hari meeting semua -> nol. */
  var uh=hn*num(luar?t.uang_harian_luar:t.uang_harian_dalam,0);
  /* Transport dibayar SEKALI per perjalanan, tidak dikali jumlah hari.
     Dibuktikan di SPJ: Bekasi 2 hari = 512rb, Bali 3 hari = 938rb. */
  var transport, asal, lengkap;
  if(kt){
    transport=num(kt.tarif,0);
    asal=transport?("tarif "+kt.kota):("at-cost ke "+kt.kota+", tidak masuk kantong");
    lengkap=true;   /* 0 di daftar tujuan artinya nol beneran, bukan belum diisi */
  }else if(!luar){
    transport=num(t.transport_dalam,0);
    asal="transport dalam kota "+t.provinsi;
    lengkap=transport>0;
  }else{
    transport=transportLuar(t);
    asal="hitungan provinsi "+t.provinsi;
    lengkap=transport>0;}
  return {uh:uh,transport:transport,total:uh+transport,hn:hn,hm:hm,
          lengkap:lengkap,tarifAda:true,kota:!!kt,asal:asal};}
function skorJalan(k){return rinciJalan(k).total;}
function perJenis(daftar){
  /* Rekap satu orang dipecah per jenis kegiatan: berapa kali dan dapat
     berapa. Diurut dari yang paling besar duitnya. */
  var peta={}, urut=[];
  (daftar||[]).forEach(function(x){
    var j=x.k.jenis_id||0;
    if(!peta[j]){peta[j]={id:j,nama:namaJenis(j),n:0,jalan:0,hari:0};urut.push(peta[j]);}
    peta[j].n++; peta[j].jalan+=skorJalan(x.k); peta[j].hari+=Math.max(1,num(x.k.jumlah_hari,1));});
  urut.sort(function(a,b){return b.jalan-a.jalan||b.n-a.n;});
  return urut;}
function namaJenis(id){var j=cari(DB.jenis,id);return j?j.nama:"(kegiatan dihapus)";}
function rataLain(id){
  /* Rata-rata anggota LAIN di kategori yang sama (tim dibanding tim, TU
     dibanding TU). Orangnya sendiri dikeluarkan -- kalau ikut dihitung,
     jaraknya jadi kelihatan lebih kecil dari yang sebenarnya.
     Penyebutnya semua orang di kategori itu, termasuk yang nol, supaya
     yang terjawab "dibanding anggota tim pada umumnya", bukan "dibanding
     sesama yang kebetulan ikut". */
  var a=angg(id); if(!a) return {semua:0,jenis:{},n:0};
  var r=rekap(), total=0, n=0, peta={};
  r.forEach(function(x){
    if(x.id===id) return;
    var o=angg(x.id); if(!o||o.kategori!==a.kategori) return;
    n++; total+=x.jalan;
    perJenis(x.daftar).forEach(function(j){
      peta[j.id]=(peta[j.id]||0)+j.jalan;});});
  if(!n) return {semua:0,jenis:{},n:0};
  var jen={}; for(var k in peta) jen[k]=peta[k]/n;
  return {semua:total/n,jenis:jen,n:n};}
function uangRingkas(k,perOrang){
  /* Ditaruh di AWAL baris meta, bukan di ujung: karena tiap kartu mulai di
     x yang sama, angkanya jadi satu kolom yang gampang disusuri waktu
     mencocokkan dengan daftar SPJ. Kalau ditaruh di ujung, lokasi yang
     panjang mendorongnya keluar layar. */
  var r=rinciJalan(k);
  if(!r.tarifAda) return '<b class="duit" title="tarif provinsi belum ada">Rp ?</b>';
  return '<b class="duit"'+(r.lengkap?"":' title="tarif transport belum diisi"')+">"+
    rupiah(r.total)+(perOrang===false?"":"/org")+(r.lengkap?"":"?")+"</b>";}
function bawaanHariMeeting(j,hari){
  /* Jenis yang ditandai paket meeting mengisi 1 hari secara bawaan, bukan
     seluruh durasi: biasanya cuma salah satu harinya yang paket, sisanya
     tetap dapat uang harian. Tinggal dinaikkan kalau memang lebih. */
  if(!j||!j.paket_meeting) return 0;
  return Math.min(1,Math.max(1,num(hari,1)));}
function skorBeban(k,ketua){
  var hari=Math.max(1,num(k.jumlah_hari,1));
  var kerja=(k.tier==="luar_inap")?Math.max(1,hari-2):hari;   // nginap: buang hari pergi & pulang
  return kerja*num(k.tingkat_beban,2)*(ketua?cfg("faktor_ketua",1.2):1);}
function batas(){
  if(!PERIODE.tahun) return {dari:null,sampai:null};
  return {dari:PERIODE.tahun+"-01-01",sampai:PERIODE.tahun+"-12-31"};}
function dalamPeriode(k,b){
  if(!b.dari) return true;
  if(!k.tanggal) return true;           // belum bertanggal: selalu ikut dihitung
  return !(akhir(k)<b.dari || k.tanggal>b.sampai);}
function rekap(fj){
  var jf=(fj===undefined)?PERIODE.jenis:fj;
  var b=batas(), m={}, kg={};
  DB.kegiatan.forEach(function(k){kg[k.id]=k;});
  DB.anggota.forEach(function(a){
    m[a.id]={id:a.id,nama:a.nama,kategori:a.kategori,aktif:a.aktif,
      jalan:0,beban:0,hari:0,n:0,tier:{dalam_kota:0,luar_pp:0,luar_inap:0},daftar:[]};});
  DB.penugasan.forEach(function(p){
    var k=kg[p.kegiatan_id], o=m[p.anggota_id];
    if(!k||!o||!dalamPeriode(k,b)) return;
    if(jf&&k.jenis_id!==jf) return;
    var ketua=(k.ketua_id===p.anggota_id);
    o.jalan+=skorJalan(k); o.beban+=skorBeban(k,ketua);
    o.hari+=Math.max(1,num(k.jumlah_hari,1)); o.n++; o.tier[k.tier]++;
    o.daftar.push({k:k,ketua:ketua});});
  return Object.keys(m).map(function(x){return m[x];});}
function orangDi(kegId){
  return DB.penugasan.filter(function(p){return p.kegiatan_id===kegId;})
    .map(function(p){return angg(p.anggota_id);}).filter(Boolean);}
function bentrokPada(angId,tgl,hari,kecuali){
  if(!tgl) return [];
  var s=geser(tgl,Math.max(0,hari-1)), out=[], kg={};
  DB.kegiatan.forEach(function(k){kg[k.id]=k;});
  DB.penugasan.forEach(function(p){
    if(p.anggota_id!==angId) return;
    var k=kg[p.kegiatan_id];
    if(!k||!k.tanggal||k.id===kecuali) return;
    if(tumpang(k.tanggal,akhir(k),tgl,s)) out.push(k);});
  return out;}

/* ---------- jaringan ---------- */
function ambil(p){return fetch(SB_URL+"/rest/v1/"+p,{headers:HDR}).then(function(r){
  if(!r.ok) throw new Error("Gagal baca "+p+" ("+r.status+")");return r.json();});}
function rpc(n,a){
  return fetch(SB_URL+"/rest/v1/rpc/"+n,{method:"POST",headers:HDR,body:JSON.stringify(a)})
    .then(function(r){return r.text().then(function(t){
      if(!r.ok){var m=t;try{m=JSON.parse(t).message||t;}catch(e){}throw new Error(m);}
      try{return JSON.parse(t);}catch(e){return t;}});});}
function lanjutMuat(){
  stat(DB.kegiatan.length+" catatan kegiatan");
  render();
  return Promise.resolve();}
function muatLama(){
  return Promise.all([
    ambil("keg_anggota?select=*&order=kategori,urutan,nama"),
    ambil("keg_jenis?select=*&order=urutan,nama"),
    ambil("keg_kegiatan?select=*&order=dibuat.desc"),
    ambil("keg_penugasan?select=*"),
    ambil("keg_config_public?select=*"),
    ambil("keg_foto?select=*&order=dibuat").catch(function(){return [];})
  ]).then(function(r){
    DB.anggota=r[0]; DB.jenis=r[1]; DB.kegiatan=r[2]; DB.penugasan=r[3];
    DB.config={}; r[4].forEach(function(c){DB.config[c.kunci]=c.nilai;});
    DB.foto=r[5]||[];
    return lanjutMuat();});}
function muat(){
  stat("Memuat\u2026");
  return rpc("keg_data",{p_sandi:SANDI||PIN||""}).then(function(d){
    BARU=true; GERBANG=false;
    if(!SANDI&&PIN) SANDI=PIN;
    DB.anggota=d.anggota||[]; DB.jenis=d.jenis||[]; DB.kegiatan=d.kegiatan||[];
    DB.penugasan=d.penugasan||[]; DB.foto=d.foto||[];
    DB.sbm=d.sbm||[]; DB.kota=d.kota||[]; DB.config=d.config||{};
    return lanjutMuat();
  }).catch(function(e){
    var m=String((e&&e.message)||e||"");
    if(/[Ss]andi salah/.test(m)){
      GERBANG=true; stat("Perlu sandi"); render(); return;}
    if(/keg_data|schema cache|does not exist|Not Found|404/i.test(m)) return muatLama();
    throw e;
  }).catch(function(e){
    var m=String((e&&e.message)||e||"");
    stat("Error: "+m);
    $("#isi").innerHTML='<div class="kosong">Gagal memuat.<br>'+esc(m)+"</div>";});}

/* ---------- foto ---------- */
function kecilkanFoto(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error("gagal membaca file"));};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){rej(new Error("file ini bukan gambar"));};
      im.onload=function(){
        var MAKS=1280, w=im.width, h=im.height;
        if(!w||!h){rej(new Error("ukuran gambar tidak terbaca"));return;}
        var sk=Math.min(1, MAKS/Math.max(w,h));
        var c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(w*sk)); c.height=Math.max(1,Math.round(h*sk));
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        c.toBlob(function(b){ b?res(b):rej(new Error("gagal mengompres")); },"image/jpeg",0.75);
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });}
function simpanTtd(path,u){
  if(!path||!u) return;
  FOTO_URL[path]=(String(u).indexOf("http")===0)?u:SB_URL+"/storage/v1"+u;}
function ttdLewatEF(blok){
  return fetch(SB_URL+"/functions/v1/bukti-upload",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({pin:SANDI||PIN||"",aksi:"sign",paths:blok})})
    .then(function(r){return r.text().then(function(t){
      var d={}; try{d=JSON.parse(t);}catch(e){}
      if(!r.ok||d.error) throw new Error(d.error||("tanda tangan gagal ("+r.status+")"));
      (d.hasil||[]).forEach(function(x){
        if(x&&!x.error) simpanTtd(x.path,x.signedUrl||x.signedURL);});});});}
function ttdLangsung(blok){
  return fetch(SB_URL+"/storage/v1/object/sign/bukti",
      {method:"POST",headers:HDR,body:JSON.stringify({expiresIn:3600,paths:blok})})
    .then(function(r){ if(!r.ok) throw new Error("gagal ("+r.status+")"); return r.json();})
    .then(function(d){
      (d||[]).forEach(function(x){
        if(x&&x.signedURL&&!x.error) simpanTtd(x.path,x.signedURL);});});}
function urlFoto(path){
  if(FOTO_URL[path]) return Promise.resolve(FOTO_URL[path]);
  return urlFotoBanyak([path]).then(function(){
    if(FOTO_URL[path]) return FOTO_URL[path];
    throw new Error("foto tidak bisa dibuka");});}
function urlFotoBanyak(paths){
  var perlu=paths.filter(function(p){return p&&!FOTO_URL[p];});
  if(!perlu.length) return Promise.resolve();
  var tugas=[];
  for(var i=0;i<perlu.length;i+=100) tugas.push(perlu.slice(i,i+100));
  return Promise.all(tugas.map(function(blok){
    return BARU ? ttdLewatEF(blok)
                : ttdLangsung(blok).catch(function(){return ttdLewatEF(blok);});
  })).catch(function(){});}
function pasangFoto(){
  var arr=document.querySelectorAll("img[data-fpath]:not([data-siap])");
  if(!arr.length) return;
  var daftar=[];
  for(var i=0;i<arr.length;i++) daftar.push(arr[i].getAttribute("data-fpath"));
  urlFotoBanyak(daftar).then(function(){
    for(var j=0;j<arr.length;j++)(function(im){
      im.setAttribute("data-siap","1");
      var p=im.getAttribute("data-fpath");
      if(FOTO_URL[p]){ im.src=FOTO_URL[p]; return; }
      urlFoto(p).then(function(u){im.src=u;}).catch(function(){im.alt="gagal muat";});
    })(arr[j]);
  });}
function adaMouse(){
  try{ return !!(window.matchMedia && window.matchMedia("(hover:hover)").matches); }catch(e){ return false; }}
function gambarDari(daftar){
  var out=[];
  for(var i=0;i<daftar.length;i++){
    var f=daftar[i];
    if(f && typeof f.type==="string" && f.type.indexOf("image/")===0) out.push(f);}
  return out;}
function pasangTempel(){
  document.addEventListener("paste",function(ev){
    if(!PIN||!MODAL_KEG) return;
    var it=(ev.clipboardData&&ev.clipboardData.items)||[], f=[];
    for(var i=0;i<it.length;i++){
      if(it[i].kind==="file"&&String(it[i].type).indexOf("image/")===0){
        var x=it[i].getAsFile(); if(x) f.push(x);}}
    if(!f.length) return;
    ev.preventDefault();
    unggahBanyak(MODAL_KEG,f);});
  document.addEventListener("dragover",function(ev){
    if(PIN&&MODAL_KEG) ev.preventDefault();});
  document.addEventListener("drop",function(ev){
    if(!PIN||!MODAL_KEG) return;
    var dt=ev.dataTransfer;
    if(!dt||!dt.files||!dt.files.length) return;
    var f=gambarDari(dt.files);
    if(!f.length) return;
    ev.preventDefault();
    unggahBanyak(MODAL_KEG,f);});}
function fotoSampul(kegId){
  var f=fotoDi(kegId);
  if(!f.length) return null;
  for(var i=0;i<f.length;i++) if(f[i].sampul) return f[i];
  return f[0];}
function bukaLB(kegId,i){LB={keg:kegId,i:i||0};gambarLB();}
function tutupLB(){LB=null;gambarLB();}
function geserLB(arah){
  if(!LB) return;
  var f=fotoDi(LB.keg); if(f.length<2) return;
  LB.i=(LB.i+arah+f.length)%f.length;
  gambarLB();}
function gambarLB(){
  var el=document.getElementById("lb");
  if(!LB){ if(el&&el.parentNode) el.parentNode.removeChild(el); return; }
  var f=fotoDi(LB.keg);
  if(!f.length){ LB=null; return gambarLB(); }
  if(LB.i>=f.length) LB.i=0;
  var x=f[LB.i], banyak=f.length>1;
  var sampul=(fotoSampul(LB.keg)||{}).id===x.id;
  if(!el){
    el=document.createElement("div"); el.id="lb"; el.className="lb";
    document.body.appendChild(el);
    el.addEventListener("touchstart",function(e){
      LB&&(LB.x0=e.touches[0].clientX);},{passive:true});
    el.addEventListener("touchend",function(e){
      if(!LB||LB.x0==null) return;
      var d=e.changedTouches[0].clientX-LB.x0; LB.x0=null;
      if(Math.abs(d)>45) geserLB(d<0?1:-1);},{passive:true});
  }
  el.innerHTML=
    '<div class="lbtop"><span class="sp">'+(banyak?(LB.i+1)+" / "+f.length:"")+"</span>"+
      '<button data-aksi="lb-tutup">Tutup</button></div>'+
    '<div class="lbwrap"><img alt="bukti" src="'+esc(FOTO_URL[x.path]||"")+'"></div>'+
    '<div class="lbbot">'+
      (banyak?'<button class="nav" data-aksi="lb-prev">\u2039</button>':'<span class="nav"></span>')+
      '<span class="tgh">'+
        (PIN?(sampul?'<span style="color:#fff;font-size:12px">Ini sampulnya</span>'
                    :'<button data-aksi="lb-sampul" data-v="'+x.id+'">Jadikan sampul</button>')
            :"")+"</span>"+
      (banyak?'<button class="nav" data-aksi="lb-next">\u203a</button>':'<span class="nav"></span>')+
    "</div>";
  if(!FOTO_URL[x.path]){
    var im=el.querySelector("img");
    urlFoto(x.path).then(function(u){ if(im) im.src=u; }).catch(function(){});
  }}
function fotoHTML(kegId){
  var f=fotoDi(kegId);
  var h='<fieldset class="grp"><legend>Foto ('+f.length+")</legend>";
  if(f.length){
    h+='<div class="fotos">'+f.map(function(x,i){

        '<img data-fpath="'+esc(x.path)+'" alt="bukti" data-aksi="foto-besar" data-v="'+kegId+
          '" data-i="'+i+'"'+(((fotoSampul(kegId)||{}).id===x.id&&f.length>1)?' class="smp"':"")+">"+
        (PIN?'<button class="out fotodel" data-aksi="foto-hapus" data-v="'+x.id+
          '" data-k="'+kegId+'" title="Hapus foto">&times;</button>':"")+
        "</div>";}).join("")+"</div>";
  } else {
    h+='<div class="meta">Belum ada bukti foto.</div>';
  }
  if(PIN){
    h+='<div class="aksi"><button data-aksi="foto-tambah" data-v="'+kegId+'">+ Tambah foto</button></div>';
    if(adaMouse()) h+='<div class="meta" style="margin-top:6px">Bisa juga tempel (Ctrl+V) atau seret foto ke sini.</div>';}
  return h+"</fieldset>";}
function unggahBanyak(kegId,files){
  if(!PIN){stat("Masuk admin dulu");return;}
  var total=files.length, ke=0, gagal=0;
  files.reduce(function(pr,f){
    return pr.then(function(){
      ke++;
      return unggahFoto(kegId,f,total>1?("Foto "+ke+"/"+total+": "):"",true)
        .catch(function(){gagal++;});
    });
  },Promise.resolve()).then(function(){
    return muat();
  }).then(function(){
    stat(gagal?(gagal+" dari "+total+" foto gagal diunggah")
              :(total>1?total+" foto tersimpan":"Foto tersimpan"));
    detailKegiatan(kegId);
  });}
function unggahFoto(kegId,file,awalan,tundaMuat){
  if(!PIN){stat("Masuk admin dulu");return Promise.resolve();}
  var aw=awalan||"", blob=null;
  stat(aw+"Menyiapkan foto\u2026");
  return kecilkanFoto(file).then(function(b){
    blob=b;
    stat(aw+"Mengunggah ("+Math.round(b.size/1024)+" KB)\u2026");
    return fetch(SB_URL+"/functions/v1/bukti-upload",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({pin:PIN,kegiatan_id:kegId,tipe:"image/jpeg"})});
  }).then(function(r){
    return r.text().then(function(t){
      var d={}; try{d=JSON.parse(t);}catch(e){}
      if(!r.ok||d.error) throw new Error(d.error||("izin unggah gagal ("+r.status+")"));
      return d;});
  }).then(function(d){
    return fetch(d.url,{method:"PUT",headers:{"Content-Type":"image/jpeg"},body:blob})
      .then(function(r){
        if(!r.ok) return r.text().then(function(t){
          throw new Error("unggah gagal ("+r.status+") "+t.slice(0,120));});
        return d.path;});
  }).then(function(path){
    return rpc("keg_simpan_foto",{p_pin:PIN,p_kegiatan_id:kegId,p_path:path,p_keterangan:""});
  }).then(function(){
    if(tundaMuat) return null;
    return muat().then(function(){ stat("Foto tersimpan"); detailKegiatan(kegId); });
  }).catch(function(e){ stat(aw+"Gagal: "+e.message); throw e; });}

function ringkasHTML(){
  var arr, j, blm;
  if(TAB==="orang"){
    var b=batas(), jf=PERIODE.jenis;
    arr=DB.kegiatan.filter(function(k){return dalamPeriode(k,b)&&(!jf||k.jenis_id===jf);});
    j=jf?cari(DB.jenis,jf):null;
    blm=arr.filter(function(k){return !k.tanggal;}).length;
    return "<b>"+arr.length+"</b> kegiatan"+(PERIODE.tahun?" di "+PERIODE.tahun:"")+
      (j?" · "+esc(j.nama):"")+(blm?' · <b>'+blm+"</b> belum bertanggal":"");}
  var cf=(TAB==="catat")?CATAT_JENIS:0;
  arr=DB.kegiatan.filter(function(k){return !cf||k.jenis_id===cf;});
  j=cf?cari(DB.jenis,cf):null;
  blm=arr.filter(function(k){return !k.tanggal;}).length;
  var tanpaFoto=arr.filter(function(k){return !fotoDi(k.id).length;}).length;

    (blm?' · <b>'+blm+"</b> belum bertanggal":"")+
    (tanpaFoto?' · <b>'+tanpaFoto+"</b> belum ada foto":"");}

function viewCatat(){
  var h="";
  if(PIN) h+='<button class="besar" data-aksi="baru">+ Catat kegiatan</button>';
  else h+='<div class="meta" style="padding:4px 0">Mode lihat saja. Masuk lewat tab Admin untuk mencatat.</div>';
  h+='<div class="baris" style="margin:8px 0">'+
    '<select data-aksi="cjenis"><option value="0">Semua kegiatan</option>'+

      ">"+esc(j.nama)+"</option>";}).join("")+"</select></div>";
  var semua=DB.kegiatan.filter(function(k){return !CATAT_JENIS||k.jenis_id===CATAT_JENIS;});
  if(!semua.length) return h+'<div class="kosong">'+
    (DB.kegiatan.length?"Tidak ada catatan untuk filter ini.":"Belum ada catatan.<br>Mulai dari tombol di atas.")+"</div>";
  var tanpa=semua.filter(function(k){return !k.tanggal;});
  var ada=semua.filter(function(k){return k.tanggal;}).sort(function(a,b){
    if(a.tanggal!==b.tanggal) return a.tanggal<b.tanggal?1:-1;
    return a.dibuat<b.dibuat?1:-1;});
  function kartu(k){

      '<div class="krow">'+

         :'<span class="kthumb kosong" title="belum ada foto"></span>')+
      '<div class="kinfo">'+
        '<div class="jud">'+esc(namaKeg(k))+"</div>"+
        '<div class="meta">'+uangRingkas(k)+" \u00b7 "+tglTeks(k,true)+
          (num(k.jumlah_hari,1)>1?" \u00b7 "+num(k.jumlah_hari,1)+" hari":"")+
          (k.lokasi?" \u00b7 "+esc(k.lokasi):"")+"</div>"+
        '<div class="meta">'+namaRingkas(k)+"</div>"+

  h+='<div style="margin-top:8px">';
  if(tanpa.length)

    peta[key].isi.push(k);});
  if(BULAN_BUKA===null){BULAN_BUKA={}; if(grup.length) BULAN_BUKA[grup[0].key]=true;}
  grup.forEach(function(gr){

       "<summary>"+gr.label+" <span class=\"meta\">("+gr.isi.length+")</span></summary>"+

      if(v.slice(0,2)==="k:"){FORM.kota=v.slice(2);FORM.provinsi="";}

function banding(nilai,rata){
  if(!rata) return "sendirian";
  var k=nilai/rata;
  if(k>=0.95&&k<=1.05) return "setara";
  return (Math.round(k*10)/10).toString().replace(".",",")+"\u00d7 rata-rata";}
function jenisHTML(daftar,RT){
  var baris=perJenis(daftar);
  if(!baris.length) return "";
  RT=RT||{jenis:{},n:0};
  var maks=1;
  baris.forEach(function(x){
    if(x.jalan>maks) maks=x.jalan;
    var rt=RT.jenis[x.id]||0; if(rt>maks) maks=rt;});
  return '<fieldset class="grp"><legend>Per jenis kegiatan</legend>'+
    baris.map(function(x){
      var rt=RT.jenis[x.id]||0;
      return '<div style="margin-bottom:7px">'+
        '<div style="display:flex;gap:8px;align-items:baseline">'+
          '<span style="flex:1;min-width:0">'+esc(x.nama)+"</span>"+
          '<span class="meta" style="flex:none">'+x.n+"\u00d7 \u00b7 <b>"+rupiah(x.jalan)+"</b></span></div>"+
        '<div class="bar" style="margin-top:3px"><i class="a" style="width:'+
          (x.jalan/maks*100).toFixed(0)+'%"></i>'+
          (rt?'<u style="left:'+Math.min(100,rt/maks*100).toFixed(0)+'%" title="rata-rata '+
            esc(rupiah(rt))+'"></u>':"")+"</div>"+
        '<div class="meta" style="text-align:right">'+esc(banding(x.jalan,rt))+"</div></div>";}).join("")+
    '<div class="meta">Batang = rupiah yang dia terima. Garis tegak = rata-rata '+
    (RT.n||0)+' anggota lain di kategori yang sama.</div></fieldset>';}

/* ---------- salin / csv ---------- */
function salin(t,p){
  var ok=function(){stat(p||"Tersalin");};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(ok,function(){salinLama(t,ok);});
  else salinLama(t,ok);}
function salinLama(t,ok){
  var ta=document.createElement("textarea");
  ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{document.execCommand("copy");ok();}catch(e){stat("Gagal menyalin");}
  document.body.removeChild(ta);}
function teksKegiatan(k){
  var o=orangDi(k.id);
  var s="*"+namaKeg(k)+"*\n"+tglTeks(k)+" ("+num(k.jumlah_hari,1)+" hari)\n";
  if(k.lokasi) s+=k.lokasi+"\n";
  var inti=o.filter(function(a){return a.kategori!=="tu";});
  var tu=o.filter(function(a){return a.kategori==="tu";});
  if(inti.length) s+="\nTim: "+inti.map(function(a){
    return a.nama+(k.ketua_id===a.id?" (ketua)":"");}).join(", ")+"\n";
  if(tu.length) s+="TU: "+tu.map(function(a){return a.nama;}).join(", ")+"\n";
  if(k.catatan) s+="\n"+k.catatan+"\n";
  return s;}
function teksRekap(){
  var r=rekap(), s="*Rekap kegiatan \u2014 "+labelFilter()+"*\n";
  ["tim","tu"].forEach(function(kat){
    var rows=r.filter(function(x){return x.kategori===kat&&(x.aktif||x.n>0);});
    if(!rows.length) return;
    rows.sort(function(a,b){return b.jalan-a.jalan;});
    s+="\n_"+(kat==="tim"?"Tim inti":"Anak TU")+"_\n";
    rows.forEach(function(x,i){
      s+=(i+1)+". "+x.nama+" \u2014 "+x.n+"\u00d7 ("+x.tier.dalam_kota+" dlm kota / "+
        x.tier.luar_pp+" luar PP / "+x.tier.luar_inap+" nginep), skor "+rupiah(x.jalan)+"\n";});});
  return s;}
function unduhCSV(){
  var kg={}; DB.kegiatan.forEach(function(k){kg[k.id]=k;});
  var b=[["kegiatan","keterangan","tanggal","hari","lokasi","tier","beban","nama","peran","skor_jalan","skor_beban"]];
  DB.penugasan.forEach(function(p){
    var k=kg[p.kegiatan_id], a=angg(p.anggota_id);
    if(!k||!a) return;
    var kt=(k.ketua_id===a.id);
    var j=k.jenis_id?cari(DB.jenis,k.jenis_id):null;
    b.push([j?j.nama:"",k.judul,k.tanggal||"",num(k.jumlah_hari,1),k.lokasi,TIER[k.tier],
      BEBAN[k.tingkat_beban],a.nama,kt?"ketua":a.kategori==="tu"?"TU":"anggota",
      Math.round(skorJalan(k)),bulat(skorBeban(k,kt))]);});
  var csv=b.map(function(r){return r.map(function(c){
    return '"'+String(c==null?"":c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  var url=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));
  var a=document.createElement("a"); a.href=url; a.download="kegiatan-"+hariIni()+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  stat("CSV diunduh");}

function simpanKegiatan(){
  bacaForm();
  var f=FORM;
  if(!f.jenis_id){stat("Pilih kegiatannya dulu");return;}
  var orang=Object.keys(f.orang).map(function(x){return parseInt(x,10);});
  if(!orang.length){stat("Centang minimal satu nama");return;}
  stat("Menyimpan\u2026");
  var arg={p_pin:PIN,p_id:f.id,p_jenis_id:f.jenis_id,p_judul:f.judul,
    p_tanggal:f.tanggal||null,p_jumlah_hari:num(f.jumlah_hari,1),p_lokasi:f.lokasi,
    p_tier:f.tier,p_tingkat_beban:num(f.tingkat_beban,2),p_ketua_id:f.ketua_id,
    p_catatan:f.catatan,p_orang:orang,
    p_provinsi:f.provinsi||null, p_kota:f.kota||null,
    p_hari_meeting:Math.min(num(f.hari_meeting,0),num(f.jumlah_hari,1))};
  /* Dua dunia: kalau 25-tujuan.sql belum dijalankan, fungsinya belum kenal
     p_kota dan Postgres menolak seluruh panggilan. Daripada mencatat jadi
     mati total, ulangi tanpa p_kota -- tujuannya saja yang belum tersimpan. */
  return rpc("keg_simpan_kegiatan",arg)
    .catch(function(e){
      if(!/p_kota|does not exist|schema cache/i.test(e.message||"")) throw e;
      var lama={}; for(var k in arg) if(k!=="p_kota") lama[k]=arg[k];
      return rpc("keg_simpan_kegiatan",lama);})
    .then(function(){FORM=null;return muat();})
    .then(function(){stat("Tersimpan");})
    .catch(function(e){stat("Gagal: "+e.message);});}

      p_tl:Math.max(0,parseInt($("#sTl").value,10)||0)})
      .then(function(){tutupModal();return muat();})
      .then(function(){stat("Tarif tersimpan");})
      .catch(function(e){stat("Gagal: "+e.message);});
    return;}
  if(a==="kota-baru"){formKota(null);return;}
  if(a==="kota-edit"){formKota(v);return;}
  if(a==="kota-simpan"){
    var kn=$("#kNama").value.trim();
    if(!kn){stat("Nama tujuan wajib diisi");return;}
    rpc("keg_set_transport_kota",{p_pin:PIN,p_kota:kn,
      p_provinsi:$("#kProv").value,
      p_tarif:Math.max(0,parseInt($("#kTarif").value,10)||0)})
      .then(function(){tutupModal();return muat();})
      .then(function(){stat("Tarif kota tersimpan");})
      .catch(function(e){stat("Gagal: "+e.message);});
    return;}
  if(a==="kota-hapus"){
    if(!confirm("Hapus tujuan ini? Catatan yang memakainya balik ke hitungan provinsi.")) return;
    rpc("keg_hapus_transport_kota",{p_pin:PIN,p_kota:v})
      .then(function(){tutupModal();return muat();}).then(function(){stat("Dihapus");})
      .catch(function(e){stat("Gagal: "+e.message);});return;}
  if(a==="ang-baru"){formAnggota(null);return;}
  if(a==="ang-edit"){formAnggota(angg(parseInt(v,10)));return;}
  if(a==="ang-simpan"){
    var an=$("#aNama").value.trim(); if(!an){stat("Nama wajib diisi");return;}
    rpc("keg_simpan_anggota",{p_pin:PIN,p_id:v?parseInt(v,10):null,p_nama:an,
      p_kategori:$("#aKat").value,p_aktif:$("#aAktif").value==="1"})
      .then(function(){tutupModal();return muat();}).then(function(){stat("Tersimpan");})
      .catch(function(e){stat("Gagal: "+e.message);});return;}
  if(a==="ang-hapus"){
    if(!confirm("Hapus orang ini? Semua catatan jalannya ikut hilang.")) return;
    rpc("keg_hapus_anggota",{p_pin:PIN,p_id:parseInt(v,10)})
      .then(function(){tutupModal();return muat();}).then(function(){stat("Dihapus");})
      .catch(function(e){stat("Gagal: "+e.message);});return;}
  if(a==="simpan-cfg"){
    var tugas=[], pinBaru=null, sandiBaru=null;
    document.querySelectorAll("[data-cfg]").forEach(function(i){
      var k=i.getAttribute("data-cfg"), val=i.value.trim();
      if(k==="pin"){if(val){tugas.push(["pin",val]);pinBaru=val;}return;}
      if(k==="sandi"){if(val){tugas.push(["sandi",val]);sandiBaru=val;}return;}
      if(val!==""&&val!==DB.config[k]) tugas.push([k,val]);});
    if(!tugas.length){stat("Tidak ada perubahan");return;}
    stat("Menyimpan\u2026");
    tugas.reduce(function(pr,x){return pr.then(function(){
      return rpc("keg_set_config",{p_pin:PIN,p_kunci:x[0],p_nilai:x[1]});});},Promise.resolve())
      .then(function(){
        if(pinBaru){PIN=pinBaru;try{localStorage.setItem("keg_pin",pinBaru);}catch(e){}}
        if(sandiBaru){SANDI=sandiBaru;try{localStorage.setItem("keg_sandi",sandiBaru);}catch(e){}}
        else if(pinBaru&&SANDI===PIN) SANDI=pinBaru;
        return muat();})
      .then(function(){stat("Pengaturan tersimpan");})
      .catch(function(e){stat("Gagal: "+e.message);});return;}
});

function masukSandi(){
  var el=$("#inpSandi"); if(!el) return;
  var sp=el.value.trim();
  if(!sp){stat("Isi sandi dulu");return;}
  stat("Memeriksa\u2026");
  rpc("keg_cek_sandi",{p_sandi:sp}).then(function(ok){
    if(ok===true){
      SANDI=sp; try{localStorage.setItem("keg_sandi",sp);}catch(e){}
      GERBANG=false; muat();
    } else stat("Sandi salah");
  }).catch(function(e){stat("Gagal: "+e.message);});}
document.addEventListener("keydown",function(ev){
  if(ev.key!=="Enter") return;
  var t=ev.target; if(!t||!t.id) return;
  if(t.id==="inpSandi"){ev.preventDefault();masukSandi();}});
document.addEventListener("change",function(ev){
  var el=ev.target;
  if(!el.getAttribute) return;
  if(el.hasAttribute("data-f")||el.hasAttribute("data-orang")){
    var k=el.getAttribute("data-f");
    bacaForm();
    if(k==="jenis_id"&&FORM&&FORM.jenis_id&&!FORM.id){
      var j=cari(DB.jenis,FORM.jenis_id);
      if(j){FORM.tier=j.tier;FORM.tingkat_beban=j.tingkat_beban;
        FORM.hari_meeting=bawaanHariMeeting(j,FORM.jumlah_hari);}}
    gambarLapis(true); return;}
  if(el.getAttribute("data-aksi")==="ptahun"){
    PERIODE.tahun=parseInt(el.value,10)||0; render(); return;}
  if(el.getAttribute("data-aksi")==="pjenis"){
    PERIODE.jenis=parseInt(el.value,10)||0; render(); return;}
  if(el.getAttribute("data-aksi")==="cjenis"){
    CATAT_JENIS=parseInt(el.value,10)||0; render(); return;}
});

(function(){
  try{
    var tm=localStorage.getItem("keg_tema");
    if(!tm&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches) tm="gelap";
    if(tm) document.documentElement.setAttribute("data-tema",tm);
    var sp=localStorage.getItem("keg_pin"); if(sp) PIN=sp;
    var ss=localStorage.getItem("keg_sandi"); if(ss) SANDI=ss;
  }catch(e){}
  try{sessionStorage.removeItem("keg_alih");}catch(e){}
  pasangTempel();
  muat();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(function(){});
})();
</script>
