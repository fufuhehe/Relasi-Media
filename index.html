<!DOCTYPE html>
<html lang="id" data-tema="terang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Kegiatan Tim</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#000080">
<link rel="icon" href="./icon-192.png">
<style>
:root{
  --face:#c0c0c0; --light:#ffffff; --soft:#dfdfdf; --shadow:#808080; --dark:#000000;
  --text:#000000; --textdim:#404040; --field:#ffffff; --fieldtext:#000000;
  --title1:#000080; --title2:#1084d0; --titletext:#ffffff;
  --sel:#000080; --seltext:#ffffff; --bar1:#000080; --bar2:#808000; --alert:#a00000;
}
html[data-tema="gelap"]{
  --face:#000000; --light:#ffffff; --soft:#c0c0c0; --shadow:#808080; --dark:#ffffff;
  --text:#ffffff; --textdim:#c0c0c0; --field:#000000; --fieldtext:#00ff00;
  --title1:#008080; --title2:#00c0c0; --titletext:#ffffff;
  --sel:#008080; --seltext:#ffffff; --bar1:#00ffff; --bar2:#ffff00; --alert:#ff6060;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--face);color:var(--text);
  font-family:"MS Sans Serif",Tahoma,Verdana,Geneva,sans-serif;
  font-size:14px;line-height:1.35;padding:6px 6px 40px}
.out{border:1px solid;border-color:var(--light) var(--dark) var(--dark) var(--light);
  box-shadow:inset -1px -1px 0 var(--shadow), inset 1px 1px 0 var(--soft);background:var(--face)}
.in{border:1px solid;border-color:var(--shadow) var(--light) var(--light) var(--shadow);
  box-shadow:inset -1px -1px 0 var(--soft), inset 1px 1px 0 var(--dark);background:var(--face)}
.win{margin-bottom:8px;padding:3px}
.tb{display:flex;align-items:center;gap:4px;padding:3px 3px 3px 6px;
  background:linear-gradient(90deg,var(--title1),var(--title2));color:var(--titletext);font-weight:bold}
.tb .sp{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{width:24px;height:22px;font-size:11px;font-weight:bold;line-height:1;padding:0;flex:none;min-height:22px}
.body{padding:8px}
button,.btn{font-family:inherit;font-size:14px;background:var(--face);color:var(--text);
  border:1px solid;border-color:var(--light) var(--dark) var(--dark) var(--light);
  box-shadow:inset -1px -1px 0 var(--shadow), inset 1px 1px 0 var(--soft);
  min-height:36px;padding:4px 12px;cursor:pointer}
button:active,.btn:active{border-color:var(--shadow) var(--light) var(--light) var(--shadow);
  box-shadow:inset -1px -1px 0 var(--soft), inset 1px 1px 0 var(--dark);padding:5px 11px 3px 13px}
button.kecil{min-height:28px;padding:2px 8px;font-size:13px}
button.tekan{border-color:var(--shadow) var(--light) var(--light) var(--shadow);
  box-shadow:inset -1px -1px 0 var(--soft), inset 1px 1px 0 var(--dark);font-weight:bold}
button.besar{width:100%;min-height:44px;font-weight:bold;font-size:15px}
input,select,textarea{font-family:inherit;font-size:14px;background:var(--field);color:var(--fieldtext);
  border:1px solid;border-color:var(--shadow) var(--light) var(--light) var(--shadow);
  box-shadow:inset -1px -1px 0 var(--soft), inset 1px 1px 0 var(--dark);
  padding:6px;min-height:34px;width:100%}
textarea{min-height:52px;resize:vertical}
label{display:block;margin:9px 0 3px;font-weight:bold;font-size:13px}
.baris{display:flex;gap:6px;flex-wrap:wrap}
.baris>*{flex:1 1 130px}
.aksi{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.aksi>button{flex:1 1 auto}
.seg{display:flex;gap:3px}.seg>button{flex:1;min-height:32px;font-size:12px;padding:2px 4px}
.tabs{display:flex;gap:2px;margin-bottom:-1px;position:relative;z-index:2}
.tab{flex:1;background:var(--face);border:1px solid;
  border-color:var(--light) var(--dark) var(--dark) var(--light);border-bottom:none;
  padding:8px 6px;min-height:0;font-size:13px;box-shadow:inset 1px 1px 0 var(--soft)}
.tab.on{font-weight:bold;padding-bottom:10px;margin-top:-2px}
.grp{border:1px solid;border-color:var(--shadow) var(--light) var(--light) var(--shadow);
  padding:8px;margin:12px 0 0}
.grp>legend{padding:0 4px;font-weight:bold;font-size:13px}
.kart{padding:8px;margin-bottom:6px;cursor:pointer}
.kart .jud{font-weight:bold}
.meta{font-size:12px;color:var(--textdim)}
.chip{display:inline-block;padding:1px 5px;margin:2px 3px 0 0;font-size:11px;
  border:1px solid var(--dark);background:var(--face)}
.chip.w{border-color:var(--alert);color:var(--alert);font-weight:bold}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px;text-align:left;border-bottom:1px solid var(--shadow)}
th{font-size:12px;border-bottom:2px solid var(--shadow)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:9px;background:var(--field);border:1px solid var(--shadow);min-width:44px}
.bar i{display:block;height:100%}
.bar i.a{background:var(--bar1)} .bar i.b{background:var(--bar2)}
.pilih{display:flex;align-items:center;gap:9px;padding:8px 4px;border-bottom:1px solid var(--shadow)}
.pilih input[type=checkbox]{width:24px;height:24px;min-height:24px;flex:none;box-shadow:none;margin:0}
.pilih .nm{flex:1;min-width:0}
.kosong{padding:18px;text-align:center;color:var(--textdim);font-size:13px}
.bawah{position:fixed;left:0;right:0;bottom:0;background:var(--face);border-top:1px solid var(--light);
  padding:3px 6px;display:flex;gap:6px;align-items:center;font-size:12px;box-shadow:0 -1px 0 var(--shadow)}
.bawah .st{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border:1px solid;border-color:var(--shadow) var(--light) var(--light) var(--shadow);padding:3px 5px}
.tutup{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;overflow:auto;padding:8px}
.modal{max-width:600px;margin:10px auto}
details>summary{cursor:pointer;padding:7px 4px;font-weight:bold;font-size:13px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"\25B8 ";}
details[open]>summary:before{content:"\25BE ";}
</style>
</head>
<body>

<div class="out win">
  <div class="tb"><span class="sp" id="judul">Catatan Kegiatan Tim</span>
    <button class="out tbtn" data-aksi="tema" title="Tema">&#9680;</button></div>
  <div class="body" style="padding:5px 8px" id="ringkas">Memuat&hellip;</div>
</div>

<div class="tabs" id="tabs"></div>
<div class="out win" style="padding:8px"><div id="isi" class="kosong">Memuat data&hellip;</div></div>

<div class="bawah"><span class="st" id="status">Siap</span>
  <button class="kecil" data-aksi="muat">Refresh</button></div>
<div id="lapis"></div>

<script>
"use strict";
var SB_URL="https://wwgqgsjyaodxfuhjwksj.supabase.co";
var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3Z3Fnc2p5YW9keGZ1aGp3a3NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNzU3ODcsImV4cCI6MjEwMTg1MTc4N30.PfrrLh0TWXT1mvI_ObpDE9iuKn-KhzDiSoCVr3qI5Vo";
var HDR={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"};

var DB={anggota:[],jenis:[],kegiatan:[],penugasan:[],config:{}};
var TAB="catat", PIN=null, FORM=null, MODAL=null;
var PERIODE={tahun:new Date().getFullYear(),jenis:0};

var TIER={dalam_kota:"Dalam kota",luar_pp:"Luar kota PP",luar_inap:"Luar kota nginep"};
var TIERP={dalam_kota:"Dlm kota",luar_pp:"Luar PP",luar_inap:"Luar nginep"};
var BEBAN={1:"Ringan",2:"Sedang",3:"Berat"};
var BLN3=["","Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

/* ---------- util ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function stat(m){var e=$("#status"); if(e) e.textContent=m;}
function num(v,d){var n=parseFloat(v); return isFinite(n)?n:d;}
function cfg(k,d){return num(DB.config[k],d);}
function bulat(n){return Math.round(n*10)/10;}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+
  "-"+String(d.getDate()).padStart(2,"0");}
function hariIni(){return iso(new Date());}
function geser(s,n){var t=Date.parse(s+"T00:00:00Z")+n*86400000;return new Date(t).toISOString().slice(0,10);}
function akhir(k){return k.tanggal?geser(k.tanggal,Math.max(0,num(k.jumlah_hari,1)-1)):null;}
function tglTeks(k){
  if(!k.tanggal) return "tanggal belum ada";
  var p=k.tanggal.split("-"), a=parseInt(p[2],10)+" "+BLN3[parseInt(p[1],10)];
  var h=num(k.jumlah_hari,1);
  if(h<=1) return a+" "+p[0];
  var b=akhir(k).split("-");
  if(b[1]===p[1]) return parseInt(p[2],10)+"\u2013"+parseInt(b[2],10)+" "+BLN3[parseInt(p[1],10)]+" "+p[0];
  return a+" \u2013 "+parseInt(b[2],10)+" "+BLN3[parseInt(b[1],10)]+" "+b[0];}
function tumpang(a1,a2,b1,b2){return !(a2<b1||a1>b2);}
function labelFilter(){var j=PERIODE.jenis?cari(DB.jenis,PERIODE.jenis):null;
  return (PERIODE.tahun||"semua waktu")+(j?" \u00b7 "+j.nama:"");}
function cari(arr,id){for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i];return null;}
function angg(id){return cari(DB.anggota,id);}
function namaKeg(k){
  var j=k.jenis_id?cari(DB.jenis,k.jenis_id):null;
  var n=j?j.nama:"(kegiatan dihapus)";
  return k.judul?n+" \u2014 "+k.judul:n;}

/* ---------- skor ---------- */
function skorJalan(k){
  var h=Math.max(1,num(k.jumlah_hari,1));
  if(k.tier==="luar_inap") return cfg("poin_luar_inap",3)+cfg("poin_per_malam",2)*(h-1);
  if(k.tier==="luar_pp")   return cfg("poin_luar_pp",2.5)*h;
  return cfg("poin_dalam_kota",1)*h;}
function skorBeban(k,ketua){
  return Math.max(1,num(k.jumlah_hari,1))*num(k.tingkat_beban,2)*(ketua?cfg("faktor_ketua",1.2):1);}
function batas(){
  if(!PERIODE.tahun) return {dari:null,sampai:null};
  return {dari:PERIODE.tahun+"-01-01",sampai:PERIODE.tahun+"-12-31"};}
function dalamPeriode(k,b){
  if(!b.dari) return true;
  if(!k.tanggal) return true;           // belum bertanggal: selalu ikut dihitung
  return !(akhir(k)<b.dari || k.tanggal>b.sampai);}
function rekap(fj){
  var jf=(fj===undefined)?PERIODE.jenis:fj;
  var b=batas(), m={}, kg={};
  DB.kegiatan.forEach(function(k){kg[k.id]=k;});
  DB.anggota.forEach(function(a){
    m[a.id]={id:a.id,nama:a.nama,kategori:a.kategori,aktif:a.aktif,
      jalan:0,beban:0,hari:0,n:0,tier:{dalam_kota:0,luar_pp:0,luar_inap:0},daftar:[]};});
  DB.penugasan.forEach(function(p){
    var k=kg[p.kegiatan_id], o=m[p.anggota_id];
    if(!k||!o||!dalamPeriode(k,b)) return;
    if(jf&&k.jenis_id!==jf) return;
    var ketua=(k.ketua_id===p.anggota_id);
    o.jalan+=skorJalan(k); o.beban+=skorBeban(k,ketua);
    o.hari+=Math.max(1,num(k.jumlah_hari,1)); o.n++; o.tier[k.tier]++;
    o.daftar.push({k:k,ketua:ketua});});
  return Object.keys(m).map(function(x){return m[x];});}
function orangDi(kegId){
  return DB.penugasan.filter(function(p){return p.kegiatan_id===kegId;})
    .map(function(p){return angg(p.anggota_id);}).filter(Boolean);}
function bentrokPada(angId,tgl,hari,kecuali){
  if(!tgl) return [];
  var s=geser(tgl,Math.max(0,hari-1)), out=[], kg={};
  DB.kegiatan.forEach(function(k){kg[k.id]=k;});
  DB.penugasan.forEach(function(p){
    if(p.anggota_id!==angId) return;
    var k=kg[p.kegiatan_id];
    if(!k||!k.tanggal||k.id===kecuali) return;
    if(tumpang(k.tanggal,akhir(k),tgl,s)) out.push(k);});
  return out;}

/* ---------- jaringan ---------- */
function ambil(p){return fetch(SB_URL+"/rest/v1/"+p,{headers:HDR}).then(function(r){
  if(!r.ok) throw new Error("Gagal baca "+p+" ("+r.status+")");return r.json();});}
function rpc(n,a){
  return fetch(SB_URL+"/rest/v1/rpc/"+n,{method:"POST",headers:HDR,body:JSON.stringify(a)})
    .then(function(r){return r.text().then(function(t){
      if(!r.ok){var m=t;try{m=JSON.parse(t).message||t;}catch(e){}throw new Error(m);}
      try{return JSON.parse(t);}catch(e){return t;}});});}
function muat(){
  stat("Memuat\u2026");
  return Promise.all([
    ambil("keg_anggota?select=*&order=kategori,urutan,nama"),
    ambil("keg_jenis?select=*&order=urutan,nama"),
    ambil("keg_kegiatan?select=*&order=dibuat.desc"),
    ambil("keg_penugasan?select=*"),
    ambil("keg_config_public?select=*")
  ]).then(function(r){
    DB.anggota=r[0]; DB.jenis=r[1]; DB.kegiatan=r[2]; DB.penugasan=r[3];
    DB.config={}; r[4].forEach(function(c){DB.config[c.kunci]=c.nilai;});
    stat(DB.kegiatan.length+" catatan kegiatan");
    render();
  }).catch(function(e){
    stat("Error: "+e.message);
    $("#isi").innerHTML='<div class="kosong">Gagal memuat.<br>'+esc(e.message)+"</div>";});}

/* ---------- render ---------- */
function render(){
  var nm=DB.config.nama_tim||"Catatan Kegiatan Tim";
  $("#judul").textContent=nm; document.title=nm;
  var b=batas(), tot=DB.kegiatan.filter(function(k){return dalamPeriode(k,b);}).length;
  var blm=DB.kegiatan.filter(function(k){return !k.tanggal;}).length;
  $("#ringkas").innerHTML="<b>"+tot+"</b> kegiatan"+(PERIODE.tahun?" di "+PERIODE.tahun:"")+
    (blm?' \u00b7 <b>'+blm+"</b> belum bertanggal":"");
  var t=[["catat","Catat"],["orang","Orang"],["admin",PIN?"Admin \u2713":"Admin"]];
  $("#tabs").innerHTML=t.map(function(x){
    return '<button class="tab'+(TAB===x[0]?" on":"")+'" data-aksi="tab" data-v="'+x[0]+'">'+x[1]+"</button>";}).join("");
  var isi=$("#isi"); isi.className="";
  isi.innerHTML = TAB==="catat"?viewCatat() : TAB==="orang"?viewOrang() : viewAdmin();
  gambarLapis();}

function viewCatat(){
  var h="";
  if(PIN) h+='<button class="besar" data-aksi="baru">+ Catat kegiatan</button>';
  else h+='<div class="meta" style="padding:4px 0">Mode lihat saja. Masuk lewat tab Admin untuk mencatat.</div>';
  var list=DB.kegiatan.slice().sort(function(a,b){
    if(!a.tanggal&&b.tanggal) return -1;
    if(a.tanggal&&!b.tanggal) return 1;
    if(a.tanggal&&b.tanggal) return a.tanggal<b.tanggal?1:-1;
    return a.dibuat<b.dibuat?1:-1;});
  if(!list.length) return h+'<div class="kosong">Belum ada catatan.<br>Mulai dari tombol di atas.</div>';
  h+='<div style="margin-top:8px">'+list.map(function(k){
    var o=orangDi(k.id);
    return '<div class="in kart" data-aksi="detail" data-v="'+k.id+'">'+
      '<div class="jud">'+esc(namaKeg(k))+"</div>"+
      '<div class="meta">'+tglTeks(k)+" \u00b7 "+num(k.jumlah_hari,1)+" hari"+
        (k.lokasi?" \u00b7 "+esc(k.lokasi):"")+"</div>"+
      '<div>'+(o.length?o.map(function(a){
        return '<span class="chip">'+esc(a.nama)+(k.ketua_id===a.id?" \u2605":"")+"</span>";}).join("")
        :'<span class="chip w">belum ada nama</span>')+"</div></div>";}).join("")+"</div>";
  if(PIN) h+='<div class="aksi"><button data-aksi="wa-rekap">Salin rekap ke WA</button>'+
             '<button data-aksi="csv">Export CSV</button></div>';
  return h;}

function viewOrang(){
  var r=rekap(), h="";
  var thn=[], y=new Date().getFullYear();
  for(var i=y;i>=y-3;i--) thn.push(i);
  h+='<div class="baris" style="margin-bottom:8px">'+
    '<select data-aksi="ptahun"><option value="0"'+(PERIODE.tahun?"":" selected")+
      ">Semua waktu</option>"+
    thn.map(function(t){return '<option value="'+t+'"'+(PERIODE.tahun===t?" selected":"")+">"+t+"</option>";}).join("")+
    "</select>"+
    '<select data-aksi="pjenis"><option value="0">Semua kegiatan</option>'+
    DB.jenis.map(function(j){return '<option value="'+j.id+'"'+(PERIODE.jenis===j.id?" selected":"")+
      ">"+esc(j.nama)+"</option>";}).join("")+"</select></div>";
  ["tim","tu"].forEach(function(kat){
    var rows=r.filter(function(x){return x.kategori===kat&&(x.aktif||x.n>0);});
    if(!rows.length) return;
    rows.sort(function(a,b){return a.jalan-b.jalan;});
    var pakai=rows.filter(function(x){return x.n>0;});
    var aJ=pakai.length?pakai.reduce(function(s,x){return s+x.jalan;},0)/pakai.length:0;
    var aB=pakai.length?pakai.reduce(function(s,x){return s+x.beban;},0)/pakai.length:0;
    var mJ=1,mB=1;
    rows.forEach(function(x){mJ=Math.max(mJ,x.jalan);mB=Math.max(mB,x.beban);});
    h+='<fieldset class="grp"><legend>'+(kat==="tim"?"Tim inti":"Anak TU")+
      "</legend><table><tr><th>Nama</th><th>Jalan</th><th>Beban</th><th class=n>Kali</th></tr>"+
      rows.map(function(x){
        var flag=(!PERIODE.jenis&&pakai.length>1&&x.beban>aB&&x.jalan<aJ);
        return '<tr data-aksi="lihat" data-v="'+x.id+'" style="cursor:pointer">'+
          "<td><b>"+esc(x.nama)+"</b>"+
            (flag?'<div class="chip w">jarang jalan, beban tinggi</div>':"")+"</td>"+
          '<td><div class="bar"><i class="a" style="width:'+(x.jalan/mJ*100).toFixed(0)+'%"></i></div>'+
            '<span class="meta">'+bulat(x.jalan)+"</span></td>"+
          '<td><div class="bar"><i class="b" style="width:'+(x.beban/mB*100).toFixed(0)+'%"></i></div>'+
            '<span class="meta">'+bulat(x.beban)+"</span></td>"+
          '<td class="n">'+x.n+"</td></tr>";}).join("")+"</table>"+
      '<div class="meta" style="margin-top:6px">'+(PERIODE.jenis?
        "Kolom <b>Kali</b> = berapa kali ikut kegiatan ini.":
        "Urut dari yang paling jarang jalan.")+" Ketuk nama untuk riwayat.</div>"+
      "</fieldset>";});
  return h||'<div class="kosong">Belum ada anggota.</div>';}

function viewAdmin(){
  if(!PIN) return '<fieldset class="grp"><legend>Masuk admin</legend>'+
    "<label>PIN</label><input type=password inputmode=numeric id=inpPin>"+
    '<div class="aksi"><button data-aksi="login">Masuk</button></div>'+
    '<div class="meta" style="margin-top:8px">PIN awal 1234 \u2014 ganti setelah masuk.</div></fieldset>';
  var h='<div class="aksi" style="margin:0 0 4px"><button data-aksi="logout">Keluar admin</button></div>';
  h+='<fieldset class="grp"><legend>Daftar kegiatan</legend>'+
    '<div class="meta">Bobot nempel di sini, jadi pas nyatat tinggal pilih.</div>'+
    '<div class="aksi" style="margin:6px 0"><button data-aksi="jenis-baru">+ Tambah kegiatan</button></div>'+
    (DB.jenis.length?DB.jenis.map(function(j){
      return '<div class="pilih"><span class="nm">'+esc(j.nama)+
        '<div class="meta">'+TIER[j.tier]+" \u00b7 "+BEBAN[j.tingkat_beban]+
        (j.aktif?"":" \u00b7 nonaktif")+"</div></span>"+
        '<button class="kecil" data-aksi="jenis-edit" data-v="'+j.id+'">Ubah</button></div>';}).join("")
      :'<div class="kosong">Kosong.</div>')+"</fieldset>";
  h+='<fieldset class="grp"><legend>Orang</legend>'+
    '<div class="aksi" style="margin:0 0 6px"><button data-aksi="ang-baru">+ Tambah orang</button></div>'+
    DB.anggota.map(function(a){
      return '<div class="pilih"><span class="nm">'+esc(a.nama)+
        ' <span class="meta">'+(a.kategori==="tu"?"TU":"tim")+(a.aktif?"":" \u00b7 nonaktif")+"</span></span>"+
        '<button class="kecil" data-aksi="ang-edit" data-v="'+a.id+'">Ubah</button></div>';}).join("")+
    "</fieldset>";

    :{id:null,jenis_id:null,judul:"",tanggal:"",jumlah_hari:1,lokasi:"",

function bacaForm(){
  var el=$("#lapis"); if(!el||!FORM) return;
  el.querySelectorAll("[data-f]").forEach(function(i){
    var k=i.getAttribute("data-f"), v=i.value;
    if(k==="jenis_id"||k==="ketua_id") FORM[k]=v?parseInt(v,10):null;
    else if(k==="jumlah_hari") FORM[k]=Math.min(60,Math.max(1,parseInt(v,10)||1));
    else FORM[k]=v;});
  var o={};
  el.querySelectorAll("[data-orang]").forEach(function(c){
    if(c.checked) o[parseInt(c.getAttribute("data-orang"),10)]=true;});
  FORM.orang=o;
  if(FORM.ketua_id&&!FORM.orang[FORM.ketua_id]) FORM.ketua_id=null;
  var d=el.querySelector("details"); if(d) FORM.ubahBobot=d.open;}

/* ---------- salin / csv ---------- */
function salin(t,p){
  var ok=function(){stat(p||"Tersalin");};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(ok,function(){salinLama(t,ok);});
  else salinLama(t,ok);}
function salinLama(t,ok){
  var ta=document.createElement("textarea");
  ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{document.execCommand("copy");ok();}catch(e){stat("Gagal menyalin");}
  document.body.removeChild(ta);}
function teksKegiatan(k){
  var o=orangDi(k.id);
  var s="*"+namaKeg(k)+"*\n"+tglTeks(k)+" ("+num(k.jumlah_hari,1)+" hari)\n";
  if(k.lokasi) s+=k.lokasi+"\n";
  var inti=o.filter(function(a){return a.kategori!=="tu";});
  var tu=o.filter(function(a){return a.kategori==="tu";});
  if(inti.length) s+="\nTim: "+inti.map(function(a){
    return a.nama+(k.ketua_id===a.id?" (ketua)":"");}).join(", ")+"\n";
  if(tu.length) s+="TU: "+tu.map(function(a){return a.nama;}).join(", ")+"\n";
  if(k.catatan) s+="\n"+k.catatan+"\n";
  return s;}
function teksRekap(){
  var r=rekap(), s="*Rekap kegiatan \u2014 "+labelFilter()+"*\n";
  ["tim","tu"].forEach(function(kat){
    var rows=r.filter(function(x){return x.kategori===kat&&(x.aktif||x.n>0);});
    if(!rows.length) return;
    rows.sort(function(a,b){return b.jalan-a.jalan;});
    s+="\n_"+(kat==="tim"?"Tim inti":"Anak TU")+"_\n";
    rows.forEach(function(x,i){
      s+=(i+1)+". "+x.nama+" \u2014 "+x.n+"\u00d7 ("+x.tier.dalam_kota+" dlm kota / "+
        x.tier.luar_pp+" luar PP / "+x.tier.luar_inap+" nginep), skor "+bulat(x.jalan)+"\n";});});
  return s;}
function unduhCSV(){
  var kg={}; DB.kegiatan.forEach(function(k){kg[k.id]=k;});
  var b=[["kegiatan","keterangan","tanggal","hari","lokasi","tier","beban","nama","peran","skor_jalan","skor_beban"]];
  DB.penugasan.forEach(function(p){
    var k=kg[p.kegiatan_id], a=angg(p.anggota_id);
    if(!k||!a) return;
    var kt=(k.ketua_id===a.id);
    var j=k.jenis_id?cari(DB.jenis,k.jenis_id):null;
    b.push([j?j.nama:"",k.judul,k.tanggal||"",num(k.jumlah_hari,1),k.lokasi,TIER[k.tier],
      BEBAN[k.tingkat_beban],a.nama,kt?"ketua":a.kategori==="tu"?"TU":"anggota",
      bulat(skorJalan(k)),bulat(skorBeban(k,kt))]);});
  var csv=b.map(function(r){return r.map(function(c){
    return '"'+String(c==null?"":c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  var url=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));
  var a=document.createElement("a"); a.href=url; a.download="kegiatan-"+hariIni()+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  stat("CSV diunduh");}

function simpanKegiatan(){
  bacaForm();
  var f=FORM;
  if(!f.jenis_id){stat("Pilih kegiatannya dulu");return;}
  var orang=Object.keys(f.orang).map(function(x){return parseInt(x,10);});
  if(!orang.length){stat("Centang minimal satu nama");return;}
  stat("Menyimpan\u2026");
  rpc("keg_simpan_kegiatan",{p_pin:PIN,p_id:f.id,p_jenis_id:f.jenis_id,p_judul:f.judul,
    p_tanggal:f.tanggal||null,p_jumlah_hari:num(f.jumlah_hari,1),p_lokasi:f.lokasi,
    p_tier:f.tier,p_tingkat_beban:num(f.tingkat_beban,2),p_ketua_id:f.ketua_id,
    p_catatan:f.catatan,p_orang:orang})
    .then(function(){FORM=null;return muat();})
    .then(function(){stat("Tersimpan");})
    .catch(function(e){stat("Gagal: "+e.message);});}

/* ---------- event ---------- */
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-aksi]"); if(!t) return;
  var a=t.getAttribute("data-aksi"), v=t.getAttribute("data-v");
  var perlu=["set-tier","set-beban","simpan-keg","batal"];
  if(perlu.indexOf(a)>=0) ev.preventDefault();
  if(a==="tema"){
    var g=document.documentElement.getAttribute("data-tema")==="gelap";
    document.documentElement.setAttribute("data-tema",g?"terang":"gelap");
    try{localStorage.setItem("keg_tema",g?"terang":"gelap");}catch(e){}return;}
  if(a==="muat"){muat();return;}
  if(a==="tab"){TAB=v;render();return;}
  if(a==="tutup"){tutupModal();return;}
  if(a==="batal"){FORM=null;gambarLapis();return;}
  if(a==="detail"){detailKegiatan(parseInt(v,10));return;}
  if(a==="lihat"){detailOrang(parseInt(v,10));return;}
  if(a==="baru"){bukaForm(null);return;}
  if(a==="edit-keg"){var k=cari(DB.kegiatan,parseInt(v,10)); if(k) bukaForm(k); return;}
  if(a==="set-tier"){bacaForm();FORM.tier=v;FORM.ubahBobot=true;gambarLapis();return;}
  if(a==="set-beban"){bacaForm();FORM.tingkat_beban=parseInt(v,10);FORM.ubahBobot=true;gambarLapis();return;}
  if(a==="simpan-keg"){simpanKegiatan();return;}
  if(a==="hapus-keg"){
    if(!confirm("Hapus catatan ini?")) return;
    rpc("keg_hapus_kegiatan",{p_pin:PIN,p_id:parseInt(v,10)})
      .then(function(){FORM=null;return muat();}).then(function(){stat("Dihapus");})
      .catch(function(e){stat("Gagal: "+e.message);});return;}
  if(a==="wa-keg"){var kk=cari(DB.kegiatan,parseInt(v,10));
    if(kk) salin(teksKegiatan(kk),"Tersalin");return;}
  if(a==="wa-rekap"){salin(teksRekap(),"Rekap tersalin");return;}
  if(a==="csv"){unduhCSV();return;}
  if(a==="login"){
    var p=$("#inpPin").value.trim(); if(!p){stat("Isi PIN dulu");return;}
    stat("Memeriksa\u2026");
    rpc("keg_cek_pin",{p_pin:p}).then(function(ok){
      if(ok===true){PIN=p;try{localStorage.setItem("keg_pin",p);}catch(e){}
        TAB="catat";stat("Mode admin aktif");render();}
      else stat("PIN salah");}).catch(function(e){stat("Gagal: "+e.message);});return;}
  if(a==="logout"){PIN=null;try{localStorage.removeItem("keg_pin");}catch(e){}
    stat("Keluar admin");render();return;}
  if(a==="jenis-baru"){formJenis(null);return;}
  if(a==="jenis-edit"){formJenis(cari(DB.jenis,parseInt(v,10)));return;}
  if(a==="jenis-simpan"){
    var nm=$("#jNama").value.trim(); if(!nm){stat("Nama wajib diisi");return;}
    rpc("keg_simpan_jenis",{p_pin:PIN,p_id:v?parseInt(v,10):null,p_nama:nm,
      p_tier:$("#jTier").value,p_tingkat_beban:parseInt($("#jBeban").value,10),
      p_aktif:$("#jAktif").value==="1"})
      .then(function(){tutupModal();return muat();}).then(function(){stat("Tersimpan");})
      .catch(function(e){stat("Gagal: "+e.message);});return;}
  if(a==="jenis-hapus"){
    if(!confirm("Hapus kegiatan ini dari daftar? Catatan lama tetap ada tapi namanya hilang.")) return;
    rpc("keg_hapus_jenis",{p_pin:PIN,p_id:parseInt(v,10)})
      .then(function(){tutupModal();return muat();}).then(function(){stat("Dihapus");})
      .catch(function(e){stat("Gagal: "+e.message);});return;}
  if(a==="ang-baru"){formAnggota(null);return;}
  if(a==="ang-edit"){formAnggota(angg(parseInt(v,10)));return;}
  if(a==="ang-simpan"){
    var an=$("#aNama").value.trim(); if(!an){stat("Nama wajib diisi");return;}
    rpc("keg_simpan_anggota",{p_pin:PIN,p_id:v?parseInt(v,10):null,p_nama:an,
      p_kategori:$("#aKat").value,p_aktif:$("#aAktif").value==="1"})
      .then(function(){tutupModal();return muat();}).then(function(){stat("Tersimpan");})
      .catch(function(e){stat("Gagal: "+e.message);});return;}
  if(a==="ang-hapus"){
    if(!confirm("Hapus orang ini? Semua catatan jalannya ikut hilang.")) return;
    rpc("keg_hapus_anggota",{p_pin:PIN,p_id:parseInt(v,10)})
      .then(function(){tutupModal();return muat();}).then(function(){stat("Dihapus");})
      .catch(function(e){stat("Gagal: "+e.message);});return;}
  if(a==="simpan-cfg"){
    var tugas=[], pinBaru=null;
    document.querySelectorAll("[data-cfg]").forEach(function(i){
      var k=i.getAttribute("data-cfg"), val=i.value.trim();
      if(k==="pin"){if(val){tugas.push(["pin",val]);pinBaru=val;}return;}
      if(val!==""&&val!==DB.config[k]) tugas.push([k,val]);});
    if(!tugas.length){stat("Tidak ada perubahan");return;}
    stat("Menyimpan\u2026");
    tugas.reduce(function(pr,x){return pr.then(function(){
      return rpc("keg_set_config",{p_pin:PIN,p_kunci:x[0],p_nilai:x[1]});});},Promise.resolve())
      .then(function(){
        if(pinBaru){PIN=pinBaru;try{localStorage.setItem("keg_pin",pinBaru);}catch(e){}}
        return muat();})
      .then(function(){stat("Pengaturan tersimpan");})
      .catch(function(e){stat("Gagal: "+e.message);});return;}
});

document.addEventListener("change",function(ev){
  var el=ev.target;
  if(!el.getAttribute) return;
  if(el.hasAttribute("data-f")||el.hasAttribute("data-orang")){
    var k=el.getAttribute("data-f");
    bacaForm();
    if(k==="jenis_id"&&FORM&&FORM.jenis_id&&!FORM.id){
      var j=cari(DB.jenis,FORM.jenis_id);
      if(j){FORM.tier=j.tier;FORM.tingkat_beban=j.tingkat_beban;}}
    gambarLapis(); return;}
  if(el.getAttribute("data-aksi")==="ptahun"){
    PERIODE.tahun=parseInt(el.value,10)||0; render(); return;}
  if(el.getAttribute("data-aksi")==="pjenis"){
    PERIODE.jenis=parseInt(el.value,10)||0; render(); return;}
});

(function(){
  try{
    var tm=localStorage.getItem("keg_tema");
    if(!tm&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches) tm="gelap";
    if(tm) document.documentElement.setAttribute("data-tema",tm);
    var sp=localStorage.getItem("keg_pin"); if(sp) PIN=sp;
  }catch(e){}
  muat();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(function(){});
})();
</script>
